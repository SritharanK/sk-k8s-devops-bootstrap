# Test-only Dex for tests/integration/sso. Never used by a profile.
#
# Chart oci://ghcr.io/dexidp/helm-charts/dex 0.26.0 (pinned in run.sh).
# Users, groups and the client secret are generated by run.sh at runtime and
# passed as a second values file; nothing secret is committed.

image:
  tag: v2.46.1

podSecurityContext:
  runAsNonRoot: true
  # The image declares the user by name (dex); runAsNonRoot needs the UID.
  runAsUser: 1001
  runAsGroup: 1001
  seccompProfile:
    type: RuntimeDefault

securityContext:
  allowPrivilegeEscalation: false
  readOnlyRootFilesystem: true
  capabilities:
    drop: [ALL]

# The entrypoint renders the configuration into /tmp; the root file system
# stays read-only.
volumes:
  - name: tmp
    emptyDir: {}
volumeMounts:
  - name: tmp
    mountPath: /tmp

resources:
  requests:
    cpu: 10m
    memory: 32Mi
  limits:
    cpu: 200m
    memory: 128Mi

config:
  # Plain HTTP inside the cluster. Argo CD reaches Dex through the Service;
  # tokens carry this issuer whichever address requested them.
  issuer: http://dex.dex.svc.cluster.local:5556/dex
  storage:
    type: memory
  web:
    http: 0.0.0.0:5556
  enablePasswordDB: true
  oauth2:
    # The resource owner password grant is enabled for this test only, so the
    # harness can obtain tokens without a browser. Never enable it on a real
    # identity provider.
    passwordConnector: local
    skipApprovalScreen: true
