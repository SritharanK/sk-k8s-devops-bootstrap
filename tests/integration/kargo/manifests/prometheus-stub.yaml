# Test-only stand-in for Prometheus, used by tests/integration/kargo/run.sh.
#
# The success-rate ClusterAnalysisTemplate of the argo-rollouts toolchain
# queries Prometheus. This harness runs no monitoring stack (memory), so the
# template's prometheusAddress points here instead. Every query answers an
# instant vector with one sample; run.sh sets the value through the ConfigMap
# (1 = all requests succeeded, 0.5 = half failed) to drive the verification
# to Successful or Failed. It proves that Kargo runs the platform template
# with the right arguments and gates on its result, not that the PromQL
# matches real metrics.
apiVersion: v1
kind: Namespace
metadata:
  name: prometheus-stub
  labels:
    app.kubernetes.io/part-of: integration-kargo
    pod-security.kubernetes.io/enforce: restricted
    pod-security.kubernetes.io/enforce-version: v1.36
---
apiVersion: v1
kind: ConfigMap
metadata:
  name: prometheus-stub
  namespace: prometheus-stub
data:
  value: "1"
  default.conf.template: |
    server {
      listen 8080;
      default_type application/json;
      location /api/v1/query {
        return 200 '{"status":"success","data":{"resultType":"vector","result":[{"metric":{},"value":[1700000000,"${SUCCESS_RATE}"]}]}}';
      }
      location / {
        return 404 '{"status":"error","errorType":"not_found","error":"stub"}';
      }
    }
---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: prometheus-stub
  namespace: prometheus-stub
  labels:
    app.kubernetes.io/name: prometheus-stub
spec:
  replicas: 1
  selector:
    matchLabels:
      app.kubernetes.io/name: prometheus-stub
  template:
    metadata:
      labels:
        app.kubernetes.io/name: prometheus-stub
    spec:
      automountServiceAccountToken: false
      securityContext:
        runAsNonRoot: true
        runAsUser: 101
        seccompProfile:
          type: RuntimeDefault
      containers:
        - name: nginx
          image: docker.io/nginxinc/nginx-unprivileged:1.30.6-alpine@sha256:f5116ed4606f3eb015dd4a8e28cb9b351476dc0ad4bc6e9f93b19cec130cdf03
          ports:
            - name: http
              containerPort: 8080
          env:
            - name: SUCCESS_RATE
              valueFrom:
                configMapKeyRef:
                  name: prometheus-stub
                  key: value
            - name: NGINX_ENVSUBST_FILTER
              value: ^SUCCESS_RATE$
          readinessProbe:
            httpGet:
              path: /api/v1/query
              port: http
          resources:
            requests: {cpu: 10m, memory: 16Mi}
            limits: {cpu: 100m, memory: 64Mi}
          securityContext:
            allowPrivilegeEscalation: false
            readOnlyRootFilesystem: true
            capabilities:
              drop: [ALL]
          volumeMounts:
            - name: template
              mountPath: /etc/nginx/templates
            - name: conf
              mountPath: /etc/nginx/conf.d
            - name: tmp
              mountPath: /tmp
      volumes:
        - name: template
          configMap:
            name: prometheus-stub
            items:
              - key: default.conf.template
                path: default.conf.template
        - name: conf
          emptyDir: {}
        - name: tmp
          emptyDir: {}
---
apiVersion: v1
kind: Service
metadata:
  name: prometheus-stub
  namespace: prometheus-stub
spec:
  selector:
    app.kubernetes.io/name: prometheus-stub
  ports:
    - name: http
      port: 9090
      targetPort: http
