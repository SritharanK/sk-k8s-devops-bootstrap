# yaml-language-server: $schema=../../../clusters/schema.json
#
# Test-only cluster definition for tests/integration/reference/run.sh.
# Not a real cluster: run.sh copies it to clusters/ref-test/cluster.yaml in a
# throwaway clone that it pushes to an in-cluster Git server on the kind
# cluster it-reference.
#
# It is clusters/reference/cluster.yaml with the deltas a laptop needs. Every
# delta is marked "test-only" and listed in the README:
#   - issuer selfsigned (no public DNS name for ACME HTTP-01);
#   - OpenBao volumes on kind's local-path StorageClass "standard";
#   - the Gateway proxy Service as NodePort (kind has no load balancer);
#   - image signature verification off (the locally built image is unsigned).
---
cluster:
  name: ref-test
  profile: reference
  domain: ref.localtest.me
  kubernetesMinor: "1.36"
  environments: [dev, stage, prod]

git:
  # run.sh overrides this with the in-cluster Git server (REPO_URL).
  repoURL: https://github.com/YOUR_ORG/sk-k8s-devops-bootstrap.git
  targetRevision: main

rke2:  # read by Ansible only; unused on kind
  version: v1.36.6+rke2r1
  channel: stable
  cni: canal
  podCidr: 10.42.0.0/16
  serviceCidr: 10.43.0.0/16
  registrationAddress: ""
  cisProfile: true
  etcdSnapshots:
    schedule: "0 */6 * * *"
    retention: 28
    s3: {enabled: false, endpoint: "", bucket: "", folder: "", region: ""}

namespaces:
  argocd: argocd
  dev: dev
  stage: stage
  prod: prod
  gateway: envoy-gateway-system
  certManager: cert-manager
  kyverno: kyverno
  monitoring: monitoring

platform:
  certManagerEmail: platform@example.com
  issuer: selfsigned  # test-only: the reference cluster uses letsencrypt
  imageRegistry: ghcr.io/your-org
  groups:
    admins: platform-admins
    deployers: deployers
    viewers: viewers

toolchains:
  # Same secrets backend as clusters/reference/cluster.yaml.
  sealed-secrets: {enabled: false}
  external-secrets: {enabled: true}
  openbao:
    enabled: true
    values:  # test-only: kind's local-path StorageClass instead of the default class
      openbao:
        server:
          dataStorage: {storageClass: standard}
          auditStorage: {storageClass: standard}
  platform-gateway:
    enabled: true
    values:  # test-only: kind has no LoadBalancer implementation
      proxy:
        service: {type: NodePort, externalTrafficPolicy: Cluster}
  kyverno-policies:
    enabled: true
    values:  # test-only: the image is built locally and carries no signature
      imageVerification: {enabled: false}
