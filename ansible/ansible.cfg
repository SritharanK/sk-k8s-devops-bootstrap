# Ansible configuration for this repository. Run ansible commands from the ansible/ directory.
# Values here are safe defaults; override per run with ANSIBLE_* environment variables.

[defaults]
inventory = inventories/lab/hosts.yml
roles_path = roles
collections_path = collections
# Verify SSH host keys. Add new hosts to known_hosts first (see inventories/README.md).
host_key_checking = True
# Uncomment to use a dedicated key; by default ssh uses the agent or its default identities.
# private_key_file = ~/.ssh/id_ed25519
interpreter_python = auto_silent
retry_files_enabled = False
forks = 20
timeout = 30
callback_result_format = yaml
nocows = True

[privilege_escalation]
# Playbooks set become explicitly where they need it.
become = False
become_method = sudo
become_ask_pass = False

[ssh_connection]
# No agent forwarding: a compromised host must not be able to use the operator's SSH agent.
ssh_args = -o ControlMaster=auto -o ControlPersist=60s -o ForwardAgent=no -o PreferredAuthentications=publickey
pipelining = True

[diff]
always = False
