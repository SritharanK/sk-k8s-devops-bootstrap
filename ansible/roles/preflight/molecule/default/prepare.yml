---
# Test fixtures that a cloud image already provides: ss for the port check (iproute2), sysctl for
# ansible.posix.sysctl (procps), and IP forwarding enabled in the container network namespace.
- name: Prepare
  hosts: all
  gather_facts: true
  tasks:
    - name: Install the test fixture packages (Debian family)
      ansible.builtin.apt:
        name: [iproute2, procps]
        state: present
        update_cache: true
        cache_valid_time: 3600
      when: ansible_facts['os_family'] == 'Debian'

    - name: Install the test fixture packages (RedHat family)
      ansible.builtin.dnf:
        name: [iproute, procps-ng]
        state: present
      when: ansible_facts['os_family'] == 'RedHat'

    - name: Create the sysctl drop-in directory (missing in the Rocky container image)
      ansible.builtin.file:
        path: /etc/sysctl.d
        state: directory
        owner: root
        group: root
        mode: "0755"

    - name: Enable IP forwarding in the container network namespace
      ansible.posix.sysctl:
        name: net.ipv4.ip_forward
        value: "1"
        sysctl_file: /etc/sysctl.d/99-molecule.conf
        sysctl_set: true
        state: present
