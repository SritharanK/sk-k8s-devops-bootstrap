---
dependency:
  name: galaxy
  options:
    # Molecule resolves this path from the directory it runs in (the role), not from the scenario directory.
    requirements-file: ${MOLECULE_SCENARIO_DIRECTORY}/../../../../molecule/requirements.yml
driver:
  name: docker
platforms:
  - name: base-ubuntu2404
    image: docker.io/library/ubuntu:24.04
    dockerfile: ../../../../molecule/Dockerfile.j2
    pre_build_image: false
    privileged: true
    cgroupns_mode: host
    volumes: [/sys/fs/cgroup:/sys/fs/cgroup:rw]
    tmpfs: [/run, /tmp]
    command: /lib/systemd/systemd
  - name: base-debian12
    image: docker.io/library/debian:12
    dockerfile: ../../../../molecule/Dockerfile.j2
    pre_build_image: false
    privileged: true
    cgroupns_mode: host
    volumes: [/sys/fs/cgroup:/sys/fs/cgroup:rw]
    tmpfs: [/run, /tmp]
    command: /lib/systemd/systemd
  - name: base-debian13
    image: docker.io/library/debian:13
    dockerfile: ../../../../molecule/Dockerfile.j2
    pre_build_image: false
    privileged: true
    cgroupns_mode: host
    volumes: [/sys/fs/cgroup:/sys/fs/cgroup:rw]
    tmpfs: [/run, /tmp]
    command: /lib/systemd/systemd
  - name: base-rocky9
    image: docker.io/rockylinux/rockylinux:9
    dockerfile: ../../../../molecule/Dockerfile.j2
    pre_build_image: false
    privileged: true
    cgroupns_mode: host
    volumes: [/sys/fs/cgroup:/sys/fs/cgroup:rw]
    tmpfs: [/run, /tmp]
    command: /lib/systemd/systemd
provisioner:
  name: ansible
  inventory:
    group_vars:
      all: {}
verifier:
  name: ansible
scenario:
  test_sequence: [dependency, syntax, create, prepare, converge, idempotence, verify, destroy]
# meta/main.yml has no Galaxy namespace (the roles live in this repository, not on Galaxy). Without this setting the
# Molecule prerun rejects the role name "base"; with it the role is linked into the cache as "base".
role_name_check: 2
