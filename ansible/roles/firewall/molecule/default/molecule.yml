---
dependency:
  name: galaxy
  options:
    # Molecule resolves this option against the working directory, not the scenario directory.
    requirements-file: ${MOLECULE_SCENARIO_DIRECTORY}/../../../../molecule/requirements.yml
driver:
  name: docker
platforms:
  - name: firewall-ubuntu2404
    image: docker.io/library/ubuntu:24.04
    dockerfile: ../../../../molecule/Dockerfile.j2
    pre_build_image: false
    privileged: true
    cgroupns_mode: host
    volumes: [/sys/fs/cgroup:/sys/fs/cgroup:rw]
    tmpfs: [/run, /tmp]
    command: /lib/systemd/systemd
  - name: firewall-debian12
    image: docker.io/library/debian:12
    dockerfile: ../../../../molecule/Dockerfile.j2
    pre_build_image: false
    privileged: true
    cgroupns_mode: host
    volumes: [/sys/fs/cgroup:/sys/fs/cgroup:rw]
    tmpfs: [/run, /tmp]
    command: /lib/systemd/systemd
  - name: firewall-debian13
    image: docker.io/library/debian:13
    dockerfile: ../../../../molecule/Dockerfile.j2
    pre_build_image: false
    privileged: true
    cgroupns_mode: host
    volumes: [/sys/fs/cgroup:/sys/fs/cgroup:rw]
    tmpfs: [/run, /tmp]
    command: /lib/systemd/systemd
  - name: firewall-rocky9
    image: docker.io/rockylinux/rockylinux:9
    dockerfile: ../../../../molecule/Dockerfile.j2
    pre_build_image: false
    privileged: true
    cgroupns_mode: host
    volumes: [/sys/fs/cgroup:/sys/fs/cgroup:rw]
    tmpfs: [/run, /tmp]
    command: /lib/systemd/systemd
provisioner:
  name: ansible
  inventory:
    # Every instance is a server, so the server rules (API, supervisor, etcd) render and load.
    hosts:
      all:
        children:
          rke2_servers:
            hosts:
              firewall-ubuntu2404: {}
              firewall-debian12: {}
              firewall-debian13: {}
              firewall-rocky9: {}
    group_vars:
      all: {}
verifier:
  name: ansible
# The roles are not published to Galaxy and have no namespace. Skip the Galaxy name check so Molecule links
# the role under its directory name.
role_name_check: 2
scenario:
  test_sequence: [dependency, syntax, create, prepare, converge, idempotence, verify, destroy]
