---
# tasks file for install_gitlab_server

- name: Set variable default values based on user
  set_fact:
    bashrc_path: "{{ '/root/.bashrc' if ansible_user == 'root' else '/home/' + ansible_user + '/.bashrc' }}"

- name: Install dependencies
  apt:
    name: "{{ item }}"
    state: present
  loop:
    - curl
    - openssh-server
    - ca-certificates
    - tzdata
  when: ansible_os_family == "Debian"

- name: Install dependencies (CentOS)
  yum:
    name: "{{ item }}"
    state: present
  loop:
    - curl
    - policycoreutils
    - openssh-server
    - perl
  when: ansible_os_family == "RedHat"

- name: Add GitLab repository
  apt_key:
    url: https://packages.gitlab.com/gpg.key
    state: present
  when: ansible_os_family == "Debian"

- name: Add GitLab repository (CentOS)
  rpm_key:
    state: present
    key: https://packages.gitlab.com/gpg.key
  when: ansible_os_family == "RedHat"

- name: Add the GitLab package repository (CentOS)
  shell: |
    curl https://packages.gitlab.com/install/repositories/gitlab/gitlab-ce/script.rpm.sh | sudo bash
  when: ansible_os_family == "RedHat"

- name: Ensure ~/.bashrc contains GITLAB_ROOT_PASSWORD
  lineinfile:
    path: "{{ bashrc_path }}"
    line: 'export GITLAB_ROOT_PASSWORD="{{ gitlab_root_password }}"'
    create: yes

- name: Install GitLab package
  apt:
    name: "{{ gitlab_edition }}"
    update_cache: yes
    state: present
  when: ansible_os_family == "Debian"

- name: Install GitLab package (CentOS)
  yum:
    name: "{{ gitlab_edition }}"
    state: present
  when: ansible_os_family == "RedHat"

- name: Configure GitLab
  template:
    src: gitlab.rb.j2
    dest: /etc/gitlab/gitlab.rb

- name: restart gitlab
  service:
    name: gitlab-runsvdir
    state: restarted

