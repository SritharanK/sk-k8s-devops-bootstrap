---
# defaults file for k8s_bootstrap
rke_cluster_name: "awesome-k8s-cluster"
rke_statefile: "k8s_cluster.rkestate"

kubernetes_supported_versions:
  "1.31": "v1.31.14-rancher1-1"
  "1.30": "v1.30.14-rancher1-1"
  "1.28": "v1.28.9-rancher1-1"
  "1.27": "v1.27.6-rancher1-1"
  "1.26": "v1.26.9-rancher1"
  "1.25": "v1.25.2-rancher1-1"
  "1.24": "v1.24.4-rancher1-1"
  "1.23": "v1.23.10-rancher1-1"
  "1.22": "v1.22.13-rancher1-1"
  "1.21": "v1.21.14-rancher1-1"
  "1.20": "v1.20.15-rancher2-2"

# Default Kubernetes minor version (use 1.28–1.31 with RKE 1.8)
kubernetes_version: "1.28"

rke_user: "root"
rke_release: v1.8.10
rke_binary_url: "https://github.com/rancher/rke/releases/download/{{ rke_release }}/rke_linux-amd64"
rke_kubernetes_version: "{{ kubernetes_supported_versions[kubernetes_version] }}"

# rke_config_dir: "/home/{{ rke_user }}/rke"

master_nodes: []
worker_nodes: []
ssh_port: "22"