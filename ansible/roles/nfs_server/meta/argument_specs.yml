---
argument_specs:
  main:
    short_description: NFSv4-only NFS server for lab clusters.
    description:
      - Installs the NFS server, writes the exports to /etc/exports.d/kubernetes.exports and disables NFSv3 in
        /etc/nfs.conf.d/50-nfs-server.conf, so clients only need 2049/tcp.
      - Rejects exports to every host ("*", 0.0.0.0/0, ::/0).
    options:
      nfs_server_exports:
        type: list
        elements: dict
        default: []
        description: Exported directories. The role creates each directory.
        options:
          path:
            type: path
            required: true
            description: Absolute path of the exported directory, without whitespace and not "/". Must be unique.
          clients:
            type: list
            elements: str
            required: true
            description: Client CIDRs or addresses. "*", 0.0.0.0/0 and ::/0 are rejected.
          options:
            type: str
            description: Export options. Defaults to nfs_server_export_options.
          owner:
            type: str
            default: root
            description: Owner of the exported directory.
          group:
            type: str
            default: root
            description: Group of the exported directory.
          mode:
            type: str
            default: "0755"
            description: Mode of the exported directory.
      nfs_server_export_options:
        type: str
        default: rw,sync,no_subtree_check,root_squash
        description: Export options for an item that sets none.
      nfs_server_manage_service:
        type: bool
        default: true
        description:
          - Enable and start nfs-server and run exportfs -ra when the exports change.
          - Set to false where nfsd cannot run, for example in a container.
