---
# tasks file for install_jenkins
- name: Add Jenkins repository
  get_url:
    url: https://pkg.jenkins.io/redhat-stable/jenkins.repo
    dest: /etc/yum.repos.d/jenkins.repo

- name: Import Jenkins repository key
  rpm_key:
    key: https://pkg.jenkins.io/redhat-stable/jenkins.io-2023.key
    state: present

- name: Install Jenkins
  yum:
    name: jenkins
    state: present

- name: Copy the init groovy files
  copy:
    dest: "/var/lib/jenkins/init.groovy.d/"
    src: "init.groovy.d/"

- name: Generate and copy the init groovy template files
  template:
    dest: "/var/lib/jenkins/init.groovy.d/init_create_admin_user.groovy"
    src: "init_create_admin_user.groovy.j2"

- name: Clean Jenkins Casc file (jenkins.yaml) in case there's any wrong configuration
  file:
    state: absent
    path: /var/lib/jenkins/jenkins.yaml

- name: Start and enable Jenkins service
  systemd:
    name: jenkins
    state: stopped
    enabled: yes
  ignore_errors: true

- name: Change Jenkins PORT
  lineinfile: dest=/usr/lib/systemd/system/jenkins.service
    regexp='^Environment="JENKINS_PORT=8080"'
    line='Environment="JENKINS_PORT={{ jenkins_port }}"'
  register: result_skip_startup_wizard

- name: update JENKINS_HOME ownership
  file:
    path: /var/lib/jenkins
    owner: "{{ jenkins_owner }}"
    group: "{{ jenkins_group }}"
    state: directory
    recurse: yes
  notify: Restart Jenkins

# - name: Get the content of the file initialAdminPassword
#   slurp:
#     src: /var/lib/jenkins/secrets/initialAdminPassword
#   register: file_content

# - name: Set_fact Jenkins admin initialPassword
