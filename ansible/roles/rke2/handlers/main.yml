---
# Handlers run in the order listed here: kernel parameters before the RKE2 restart.

- name: Reload NetworkManager
  ansible.builtin.systemd_service:
    name: NetworkManager.service
    state: reloaded

- name: Apply CIS kernel parameters
  ansible.builtin.command:
    argv:
      - sysctl
      - -p
      - "{{ rke2__cis_sysctl_file }}"
  register: rke2__cis_sysctl_apply
  changed_when: true
  failed_when: rke2__cis_sysctl_apply.rc != 0

# A service that was not running before this run is started by tasks/service.yml instead.
# The restart blocks until RKE2 reports ready, so with serial: 1 the next server waits for this one.
- name: Restart rke2
  ansible.builtin.systemd_service:
    name: "{{ rke2__service_unit }}"
    state: restarted
  async: "{{ rke2_service_start_timeout | int }}"
  poll: 10
  when: rke2__service_was_active | default(true) | bool
