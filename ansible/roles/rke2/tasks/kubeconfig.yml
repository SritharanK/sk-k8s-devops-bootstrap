---
# RKE2 writes the admin kubeconfig to /etc/rancher/rke2/rke2.yaml with the server https://127.0.0.1:6443 and
# the cluster, context and user all named "default". The copy on the control node points at the API endpoint
# and carries the cluster name, so several clusters can sit side by side in KUBECONFIG.
- name: Check for the admin kubeconfig
  ansible.builtin.stat:
    path: "{{ rke2__kubeconfig_remote }}"
    get_checksum: false
  register: rke2__kubeconfig_stat

- name: Read the admin kubeconfig
  ansible.builtin.slurp:
    src: "{{ rke2__kubeconfig_remote }}"
  register: rke2__kubeconfig_raw
  no_log: true
  when: rke2__kubeconfig_stat.stat.exists

- name: Create the local kubeconfig directory
  ansible.builtin.file:
    path: "{{ rke2_kubeconfig_local_path | dirname }}"
    state: directory
    mode: "0700"
  delegate_to: localhost
  become: false
  when: rke2__kubeconfig_stat.stat.exists

- name: Write the kubeconfig on the control node
  ansible.builtin.copy:
    content: "{{ rke2__kubeconfig_local | to_nice_yaml(indent=2) }}"
    dest: "{{ rke2_kubeconfig_local_path }}"
    mode: "0600"
  vars:
    rke2__kubeconfig_src: "{{ rke2__kubeconfig_raw.content | b64decode | from_yaml }}"
    rke2__kubeconfig_local: >-
      {{ rke2__kubeconfig_src | combine({
           'clusters': [{
             'name': rke2_cluster_name,
             'cluster': rke2__kubeconfig_src.clusters[0].cluster | combine({'server': rke2__api_url})}],
           'contexts': [{
             'name': rke2_cluster_name,
             'context': rke2__kubeconfig_src.contexts[0].context
               | combine({'cluster': rke2_cluster_name, 'user': rke2_cluster_name})}],
           'users': [{
             'name': rke2_cluster_name,
             'user': rke2__kubeconfig_src.users[0].user}],
           'current-context': rke2_cluster_name}) }}
  delegate_to: localhost
  become: false
  diff: false
  no_log: true
  when: rke2__kubeconfig_stat.stat.exists

- name: Show where the kubeconfig was written
  ansible.builtin.debug:
    msg: >-
      Kubeconfig for {{ rke2_cluster_name }} ({{ rke2__api_url }}) written to {{ rke2_kubeconfig_local_path }}.
      On the servers, kubectl is {{ rke2__kubectl }} with --kubeconfig {{ rke2__kubeconfig_remote }}.
  when: rke2__kubeconfig_stat.stat.exists
