---
argument_specs:
  main:
    short_description: Install, join, configure and upgrade RKE2 servers and agents.
    description:
      - The node type follows the inventory groups. The first host of rke2_servers_group bootstraps the cluster;
        the other servers and all agents join it through rke2_registration_address.
      - The playbook runs the bootstrap server first, then the other servers with serial 1, then the agents.
    author:
      - Sritharan K
    options:
      rke2_servers_group:
        type: str
        default: rke2_servers
        description: Inventory group whose hosts run rke2-server.
      rke2_agents_group:
        type: str
        default: rke2_agents
        description: Inventory group whose hosts run rke2-agent.
      rke2_cluster_group:
        type: str
        default: k8s_cluster
        description: Inventory group that holds every cluster node.
      rke2_bootstrap_host:
        type: str
        default: "{{ groups[rke2_servers_group] | default([]) | first | default('') }}"
        description:
          - Server that initialises the cluster and gets no server key in its configuration.
          - Defaults to the first host of rke2_servers_group. Override it when that host is being replaced.
      rke2_cluster_name:
        type: str
        default: rke2
        description: Cluster name, used for the cluster, context and user of the fetched kubeconfig.
      rke2_version:
        type: str
        default: CHANGE_ME
        description:
          - Exact RKE2 release, for example v1.36.6+rke2r1. CHANGE_ME is rejected.
          - Changing it upgrades the node; downgrades and skipped minor versions are refused.
      rke2_channel:
        type: str
        default: stable
        description:
          - Release channel (stable, latest, testing or v1.<minor>). An exact rke2_version always wins.
          - RPM installs use it to select the rpm.rancher.io repository.
      rke2_install_method:
        type: str
        default: ""
        choices: ["", tar, rpm]
        description: Install method passed to the install script. Empty lets the script choose.
      rke2_token:
        type: str
        default: ""
        no_log: true
        description: Shared secret that joins servers and agents. Required.
      rke2_agent_token:
        type: str
        default: ""
        no_log: true
        description: Secret that joins agents only. Empty means agents use rke2_token.
      rke2_data_dir:
        type: path
        default: /var/lib/rancher/rke2
        description: RKE2 state directory.
      rke2_cni:
        type: str
        default: canal
        choices: [canal, calico, cilium]
        description: CNI plugin deployed by RKE2.
      rke2_cluster_cidr:
        type: str
        default: 10.42.0.0/16
        description: Pod network. Must be identical on every server.
      rke2_service_cidr:
        type: str
        default: 10.43.0.0/16
        description: Service network. Must be identical on every server.
      rke2_registration_address:
        type: str
        default: ""
        description:
          - Fixed registration address (VIP or load balancer) in front of the servers.
          - Required when there is more than one server. Added to the API server certificate.
      rke2_api_endpoint:
        type: str
        default: ""
        description: Address written into the fetched kubeconfig. Added to the API server certificate.
      rke2_tls_san_extra:
        type: list
        elements: str
        default: []
        description: Extra Subject Alternative Names for the API server certificate.
      rke2_ingress_controller:
        type: str
        default: none
        choices: [none, traefik, ingress-nginx]
        description:
          - Packaged ingress controller. On releases older than v1.33, none renders disable rke2-ingress-nginx.
      rke2_disable_components:
        type: list
        elements: str
        default: []
        description: Packaged components to disable, for example rke2-metrics-server.
      rke2_cis_profile:
        type: bool
        default: false
        description:
          - Run with profile cis. Creates the etcd user on servers and installs the CIS kernel parameters.
          - Enforces restricted Pod Security Admission in every namespace except the RKE2 system namespaces.
      rke2_audit_policy_enabled:
        type: bool
        default: true
        description: Install the role's audit policy and enable API server audit logging on servers.
      rke2_audit_log_maxage:
        type: int
        default: 30
        description: Days to keep rotated audit log files.
      rke2_audit_log_maxbackup:
        type: int
        default: 10
        description: Number of rotated audit log files to keep.
      rke2_audit_log_maxsize:
        type: int
        default: 100
        description: Size in megabytes at which the audit log rotates.
      rke2_apiserver_oidc:
        type: dict
        default:
          enabled: false
          issuer_url: ""
          client_id: ""
          username_claim: email
          groups_claim: groups
          username_prefix: "oidc:"
          groups_prefix: "oidc:"
        description: OpenID Connect authentication for the API server.
        options:
          enabled:
            type: bool
            description: Add the --oidc-* flags to kube-apiserver.
          issuer_url:
            type: str
            description: HTTPS issuer URL of the identity provider.
          client_id:
            type: str
            description: Client ID that tokens must be issued for.
          username_claim:
            type: str
            description: Token claim used as the user name.
          groups_claim:
            type: str
            description: Token claim that lists the groups.
          username_prefix:
            type: str
            description: Prefix added to every OIDC user name.
          groups_prefix:
            type: str
            description: Prefix added to every OIDC group.
      rke2_kube_apiserver_args:
        type: list
        elements: str
        default: []
        description: Extra kube-apiserver flags as key=value, appended after the role's own flags.
      rke2_kubelet_args:
        type: list
        elements: str
        default: []
        description: Extra kubelet flags as key=value.
      rke2_server_taint:
        type: bool
        default: false
        description: Taint servers with CriticalAddonsOnly=true:NoExecute when the cluster has agents.
      rke2_etcd_snapshot_schedule:
        type: str
        default: "0 */6 * * *"
        description: Cron schedule of the automatic etcd snapshots.
      rke2_etcd_snapshot_retention:
        type: int
        default: 10
        description: Number of local snapshots kept on each server.
      rke2_etcd_s3:
        type: dict
        default:
          enabled: false
          endpoint: ""
          bucket: ""
          folder: ""
          region: ""
        description: Upload etcd snapshots to an S3 compatible object store.
        options:
          enabled:
            type: bool
            description: Enable the upload.
          endpoint:
            type: str
            description: S3 endpoint host, for example s3.example.com. Required when enabled.
          bucket:
            type: str
            description: Bucket name. Required when enabled.
          folder:
            type: str
            description: Folder (prefix) inside the bucket.
          region:
            type: str
            description: Bucket region.
      rke2_etcd_s3_access_key:
        type: str
        default: ""
        no_log: true
        description: S3 access key.
      rke2_etcd_s3_secret_key:
        type: str
        default: ""
        no_log: true
        description: S3 secret key.
      rke2_etcd_s3_retention:
        type: int
        default: 0
        description:
          - Snapshots kept in the bucket for the whole cluster (etcd-s3-retention, RKE2 v1.34 and later).
          - 0 keeps the RKE2 default of 5.
      rke2_registries:
        type: dict
        default: {}
        description: Contents of /etc/rancher/rke2/registries.yaml. Empty writes no file.
      rke2_kube_vip_enabled:
        type: bool
        default: false
        description: Run kube-vip as a static pod on the servers to provide the registration address as a VIP.
      rke2_kube_vip_image:
        type: str
        default: ghcr.io/kube-vip/kube-vip
        description: kube-vip image without tag.
      rke2_kube_vip_version:
        type: str
        default: v1.3.1
        description: kube-vip image tag.
      rke2_kube_vip_interface:
        type: str
        default: ""
        description: Interface that announces the VIP. Required when kube-vip is enabled.
      rke2_service_start_timeout:
        type: int
        default: 900
        description: Seconds a start or restart of the RKE2 service may take before the task fails.
      rke2_node_ready_retries:
        type: int
        default: 60
        description: Attempts while waiting for the node to report Ready.
      rke2_node_ready_delay:
        type: int
        default: 10
        description: Seconds between the attempts.
      rke2_allow_downgrade:
        type: bool
        default: false
        description: Allow installing a release older than the installed one.
      rke2_kubeconfig_fetch:
        type: bool
        default: true
        description: Copy the admin kubeconfig from the bootstrap server to the control node.
      rke2_kubeconfig_local_path:
        type: path
        default: "{{ playbook_dir }}/../data/kubeconfig-{{ rke2_cluster_name }}.yaml"
        description: Destination of the fetched kubeconfig on the control node (mode 0600).
      rke2_uninstall_confirm:
        type: bool
        default: false
        description: Not used by this entry point; see the uninstall entry point.
      rke2_node_ip:
        type: str
        default: ""
        description: Private address for cluster traffic. Empty uses the default IPv4 address from the facts.
      rke2_node_external_ip:
        type: str
        default: ""
        description: Optional external address of the node.
      rke2_node_labels:
        type: list
        elements: str
        default: []
        description: Node labels as key=value, applied when the node registers.
      rke2_node_taints:
        type: list
        elements: str
        default: []
        description: Node taints as key=value:Effect, applied when the node registers.
      rke2_node_name:
        type: str
        default: ""
        description: Node name. Empty keeps the RKE2 default, the lowercased system hostname.

  uninstall:
    short_description: Remove RKE2 from a node with the upstream uninstall script.
    description:
      - Runs rke2-uninstall.sh from the tar (/usr/local/bin, /opt/rke2/bin) or RPM (/usr/bin) location.
      - Destroys the node's cluster state, including etcd data and local snapshots on servers.
    author:
      - Sritharan K
    options:
      rke2_uninstall_confirm:
        type: bool
        default: false
        description: Must be true, otherwise the entry point refuses to run.
      rke2_cluster_group:
        type: str
        default: k8s_cluster
        description: Only hosts in this group may be uninstalled.
      rke2_data_dir:
        type: path
        default: /var/lib/rancher/rke2
        description: RKE2 state directory, passed to the uninstall script as RKE2_DATA_DIR.
