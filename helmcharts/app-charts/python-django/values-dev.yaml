# -----------------------------------------------------------------------------
# Dev environment overrides for python-django.
# Use with an Argo CD Application that has destination.namespace: dev and
# valueFiles: [values-dev.yaml]. Override image tag or DB_HOST for dev as needed.
# -----------------------------------------------------------------------------

helm-common:
  replicas: 1
  resources:
    requests: { memory: "64Mi", cpu: "50m" }
    limits:   { memory: "256Mi", cpu: "300m" }
