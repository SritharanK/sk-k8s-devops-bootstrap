helm-common:
  name: java-springboot
  tier: application
  image:
    name: "YOUR_REGISTRY/java-springboot:PLACEHOLDER_TAG"  # Set via CD or config
    pullPolicy: IfNotPresent
    containerPort: 8080
    imagePullSecrets: dockerhub-secret
  extraAnnotations:
    configmap.reloader.stakater.com/reload: ""
  env:
    - name: DB_HOST
      value: "mysql"  # Set to your DB service name (e.g. mysql, db) in prod
    - name: DB_PORT
      value: "3306"
    - name: DB_USER
      value: root
    - name: DB_PASSWORD
      value: "CHANGE_ME_OR_USE_SECRET"
    - name: DB_NAME
      value: "testdb"
    - name: DB_ENGINE
      value: django.db.backends.mysql
  replicas: 1
  livenessProbe:
    httpGet:
      path: /health
      port: 8080
    initialDelaySeconds: 30
    periodSeconds: 10
    failureThreshold: 3
  readinessProbe:
    httpGet:
      path: /health
      port: 8080
    initialDelaySeconds: 10
    periodSeconds: 5
    failureThreshold: 3
  podAnnotations: {}
  resources:
    requests: { memory: "64Mi", cpu: "50m" }
    limits:   { memory: "256Mi", cpu: "500m" }
  lifecycle: {}
  affinity: {}
  tolerations: []
  nodeSelector:
    node-role.kubernetes.io/worker: "true"
  configMapMounts: []
  hostPathVolumes: {}
  autoscaling:
    enabled: false
    minReplicas: 1
    maxReplicas: 10
    targetMemoryUtilizationPercentage: 80
  service:
    type: ClusterIP
    port: 80
    nodePorts: {}
    annotations: {}
  enabledDeployment: true
  # ── Ingress (uncomment and fill in to expose via NGINX + cert-manager TLS) ──
  # ingress:
  #   enabled: true
  #   className: "nginx"
  #   hostname:
  #     - host: java-springboot.yourdomain.com   # replace with your domain
  #       paths:
  #         - /
  #   tls: true
  #   tlsSecret: "java-springboot-tls"           # cert-manager will create this
  #   annotations:
  #     cert-manager.io/cluster-issuer: "letsencrypt-prod"
  #     nginx.ingress.kubernetes.io/ssl-redirect: "true"
