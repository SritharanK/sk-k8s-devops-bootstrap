# -----------------------------------------------------------------------------
# Dev environment overrides for surge-plugin.
# Use with an Argo CD Application that has destination.namespace: dev and
# valueFiles: [values-dev.yaml].
# -----------------------------------------------------------------------------

helm-common:
  replicas: 1
  resources:
    requests: { memory: "64Mi", cpu: "50m" }
    limits:   { memory: "256Mi", cpu: "300m" }
