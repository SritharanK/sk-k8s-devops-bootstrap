helm-common:
  name: surge-plugin
  tier: application
  image:
    name: "YOUR_REGISTRY/surge-plugin:PLACEHOLDER_TAG"  # Set via CD or config
    pullPolicy: IfNotPresent
    containerPort: 80
    imagePullSecrets: dockerhub-secret
  extraAnnotations:
    configmap.reloader.stakater.com/reload: ""
  env:
    - name: WORDPRESS_DB_HOST
      value: "db:3306"  # Set to your DB host:port in prod
    - name: WORDPRESS_DB_USER
      value: wp_admin
    - name: WORDPRESS_DB_PASSWORD
      value: "CHANGE_ME"
    - name: WORDPRESS_DB_NAME
      value: surge
  replicas: 1
  livenessProbe:
    tcpSocket:
      port: 80
    initialDelaySeconds: 30
    periodSeconds: 10
    failureThreshold: 3
  readinessProbe:
    tcpSocket:
      port: 80
    initialDelaySeconds: 10
    periodSeconds: 5
    failureThreshold: 3
  podAnnotations: {}
  resources:
    requests: { memory: "64Mi", cpu: "50m" }
    limits:   { memory: "256Mi", cpu: "500m" }
  lifecycle: {}
  affinity: {}
  tolerations: []
  nodeSelector:
    node-role.kubernetes.io/worker: "true"
  configMapMounts: []
  hostPathVolumes: {}
  autoscaling:
    enabled: false
    minReplicas: 1
    maxReplicas: 10
    targetMemoryUtilizationPercentage: 80
  service:
    type: ClusterIP
    port: 80
    nodePorts: {}
    annotations: {}
  enabledDeployment: true
