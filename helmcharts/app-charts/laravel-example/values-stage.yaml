# -----------------------------------------------------------------------------
# Stage environment overrides for laravel-example.
# Stage mirrors production configuration but targets stage-specific services.
# Use with an Argo CD Application that has destination.namespace: stage
# and valueFiles: [values-stage.yaml].
# -----------------------------------------------------------------------------

helm-common:
  name: laravel-example
  tier: application
  image:
    name: "YOUR_REGISTRY/laravel-example:PLACEHOLDER_TAG"  # Overridden by CD pipeline
    pullPolicy: IfNotPresent
    containerPort: 80
    imagePullSecrets: dockerhub-secret
  extraAnnotations:
    configmap.reloader.stakater.com/reload: ""
  replicas: 1
  livenessProbe:
    tcpSocket:
      port: 80
    initialDelaySeconds: 30
    periodSeconds: 10
    failureThreshold: 3
  readinessProbe:
    tcpSocket:
      port: 80
    initialDelaySeconds: 10
    periodSeconds: 5
    failureThreshold: 3
  resources:
    requests: { memory: "64Mi", cpu: "50m" }
    limits:   { memory: "256Mi", cpu: "300m" }
  nodeSelector:
    node-role.kubernetes.io/worker: "true"
  autoscaling:
    enabled: false
  service:
    type: ClusterIP
    port: 80
  enabledDeployment: true
