helm-common:
  name: laravel-example
  tier: application
  image:
    name: "YOUR_REGISTRY/laravel-example:PLACEHOLDER_TAG"  # Set via CD or config
    pullPolicy: IfNotPresent
    containerPort: 80
    imagePullSecrets: dockerhub-secret
  extraAnnotations:
    configmap.reloader.stackater.com/reload: ""
  replicas: 1
  livenessProbe:
    tcpSocket:
      port: 80
    initialDelaySeconds: 30
    periodSeconds: 10
    failureThreshold: 3
  readinessProbe:
    tcpSocket:
      port: 80
    initialDelaySeconds: 10
    periodSeconds: 5
    failureThreshold: 3
  # ── Prometheus scraping (uncomment to enable pod-level metrics collection) ───
  # podAnnotations:
  #   prometheus.io/scrape: "true"
  #   prometheus.io/port: "80"      # must match containerPort above
  #   prometheus.io/path: "/metrics"
  podAnnotations: {}
  resources:
    requests: { memory: "64Mi", cpu: "50m" }
    limits:   { memory: "256Mi", cpu: "500m" }
  lifecycle: {}
  affinity: {}
  tolerations: []
  nodeSelector:
    node-role.kubernetes.io/worker: "true"
  configMapMounts: []
  hostPathVolumes: {}
  autoscaling:
    enabled: false
    minReplicas: 1
    maxReplicas: 10
    targetMemoryUtilizationPercentage: 80
  pdb:
    enabled: true
    minAvailable: 1     # keep at least 1 pod live during node drain / rolling upgrades
  service:
    type: ClusterIP
    port: 80
    nodePorts: {}
    annotations: {}
  enabledDeployment: true
  # ── Ingress (uncomment and fill in to expose via NGINX + cert-manager TLS) ──
  # ingress:
  #   enabled: true
  #   className: "nginx"
  #   hostname:
  #     - host: laravel-example.yourdomain.com   # replace with your domain
  #       paths:
  #         - /
  #   tls: true
  #   tlsSecret: "laravel-example-tls"           # cert-manager will create this
  #   annotations:
  #     cert-manager.io/cluster-issuer: "letsencrypt-prod"
  #     nginx.ingress.kubernetes.io/ssl-redirect: "true"
