# -----------------------------------------------------------------------------
# Dev environment overrides for payments-example.
# Use this file when deploying to a "dev" namespace (e.g. create an Argo CD
# Application with destination.namespace: dev and valueFiles: [values-dev.yaml]).
# -----------------------------------------------------------------------------

helm-common:
  replicas: 1
  resources:
    requests: { memory: "64Mi", cpu: "50m" }
    limits:   { memory: "256Mi", cpu: "300m" }
  # Override image or DB host for dev if needed:
  # image:
  #   name: "YOUR_REGISTRY/payments-example:dev"
  # env:
  #   - name: WORDPRESS_DB_HOST
  #     value: "db.dev.svc.cluster.local:3306"
