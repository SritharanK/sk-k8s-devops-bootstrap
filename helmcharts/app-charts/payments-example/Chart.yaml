apiVersion: v2
name: payments-example
description: Example payments service Helm chart (uses helm-common library)
type: application
version: 0.0.1
dependencies:
  - name: helm-common
    version: 0.1.1
    # Local path — works out of the box without any registry setup.
    # To publish helm-common via OCI, set: oci://ghcr.io/YOUR_ORG/helm-charts
    # and update helm_chart_repo_url in config/defaults.yaml.
    repository: "file://../../helm-common"
    alias: helm-common
