# Common values for the logging toolchain (release "logging", namespace "logging").
# values-lab.yaml and values-reference.yaml hold the per-profile deltas.
#
# In-cluster addresses produced by this chart:
#   Loki gateway, push and query: http://loki-gateway.logging.svc:80
#   Alloy self-metrics:           http://alloy.logging.svc:12345/metrics

# -----------------------------------------------------------------------------
# Grafana Loki (grafana-community/loki chart)
# -----------------------------------------------------------------------------
loki:
  # Fixed resource names. The gateway Service becomes loki-gateway, which Grafana and Alloy use.
  fullnameOverride: loki

  loki:
    # Single tenant. Clients send no X-Scope-OrgID header; Loki stores everything under tenant "fake".
    auth_enabled: false
    analytics:
      reporting_enabled: false
    # schemaConfig and storage are set per profile (filesystem in lab, S3 in reference).
    ingester:
      chunk_encoding: snappy
    # Retention is enforced by the compactor. retention_period and delete_request_store are set per profile.
    compactor:
      retention_enabled: true

  # Helm test pod and loki-canary are not used on this platform.
  test:
    enabled: false
  lokiCanary:
    enabled: false

  # The rules sidecar loads LogQL rules from labelled ConfigMaps and Secrets into a local ruler directory.
  # No Loki rules are managed that way here, so it stays off. With the sidecar off and namespaced RBAC,
  # the chart creates no ClusterRole.
  sidecar:
    rules:
      enabled: false
  rbac:
    namespaced: true

  # Loki components use memberlist and object storage, not the Kubernetes API. The backend
  # sets its own value upstream (for the rules sidecar), so it is switched off separately.
  defaults:
    automountServiceAccountToken: false
  backend:
    automountServiceAccountToken: false

  gateway:
    enabled: true
    image:
      # Exact patch release. The upstream default is the floating 1.31-alpine tag.
      tag: 1.31.8-alpine
    # Log only 4xx and 5xx requests. Every Alloy push is a request, so 2xx access logs would loop back into Loki.
    verboseLogging: false
    metrics:
      enabled: true
      resources:
        requests:
          cpu: 10m
          memory: 16Mi
        limits:
          memory: 64Mi

  # Only rendered when chunksCache or resultsCache is enabled (reference profile).
  memcachedExporter:
    resources:
      requests:
        cpu: 10m
        memory: 16Mi
      limits:
        memory: 64Mi

  # Requires the monitoring toolchain: its Prometheus selects ServiceMonitors and PrometheusRules
  # labelled release=monitoring in every namespace, and its Grafana loads dashboard ConfigMaps
  # labelled grafana_dashboard=1 from every namespace.
  monitoring:
    serviceMonitor:
      enabled: true
      labels:
        release: monitoring
    rules:
      enabled: true
      labels:
        release: monitoring
    alerts:
      enabled: true
      labels:
        release: monitoring
    dashboards:
      enabled: true

# -----------------------------------------------------------------------------
# Grafana Alloy (grafana/alloy chart): pod log collector, one pod per node
# -----------------------------------------------------------------------------
alloy:
  fullnameOverride: alloy

  # The PodLogs CRD is not used by this pipeline.
  crds:
    create: false

  global:
    # Root without capabilities. Container log files under /var/log/pods are owned by root with mode 0640,
    # so the owner bits are needed to read them. No capability is required for that.
    podSecurityContext:
      runAsUser: 0
      runAsGroup: 0
      seccompProfile:
        type: RuntimeDefault

  alloy:
    enableReporting: false
    # Read offsets (positions) live on the node, so a rollout or pod restart resumes where it stopped
    # instead of re-sending or skipping lines.
    storagePath: /var/lib/alloy
    mounts:
      # /var/log from the host, read-only. The pipeline reads /var/log/pods only.
      varlog: true
      extra:
        - name: alloy-data
          mountPath: /var/lib/alloy
    securityContext:
      privileged: false
      allowPrivilegeEscalation: false
      readOnlyRootFilesystem: true
      capabilities:
        drop:
          - ALL
    configMap:
      create: true
      # Passed through tpl by the upstream chart: do not use double curly braces here.
      content: |
        logging {
          level  = "info"
          format = "logfmt"
        }

        // Pods scheduled on this node only. The chart sets K8S_NODE_NAME from spec.nodeName.
        discovery.kubernetes "pods" {
          role = "pod"

          selectors {
            role  = "pod"
            field = "spec.nodeName=" + sys.env("K8S_NODE_NAME")
          }
        }

        discovery.relabel "pod_logs" {
          targets = discovery.kubernetes.pods.targets

          rule {
            source_labels = ["__meta_kubernetes_namespace"]
            target_label  = "namespace"
          }

          rule {
            source_labels = ["__meta_kubernetes_pod_name"]
            target_label  = "pod"
          }

          rule {
            source_labels = ["__meta_kubernetes_pod_container_name"]
            target_label  = "container"
          }

          // app: the app.kubernetes.io/name label when set, otherwise the app label.
          rule {
            source_labels = ["__meta_kubernetes_pod_label_app"]
            regex         = "(.+)"
            target_label  = "app"
          }

          rule {
            source_labels = ["__meta_kubernetes_pod_label_app_kubernetes_io_name"]
            regex         = "(.+)"
            target_label  = "app"
          }

          rule {
            source_labels = ["__meta_kubernetes_pod_node_name"]
            target_label  = "node"
          }

          // Kubelet layout: /var/log/pods/<namespace>_<pod>_<uid>/<container>/<restart count>.log
          rule {
            source_labels = ["__meta_kubernetes_pod_uid", "__meta_kubernetes_pod_container_name"]
            separator     = "/"
            target_label  = "__path__"
            replacement   = "/var/log/pods/*$1/*.log"
          }
        }

        // One reader per file. Targets that differ only in internal labels (one per container port)
        // resolve to the same reader.
        loki.source.file "pod_logs" {
          targets    = discovery.relabel.pod_logs.output
          forward_to = [loki.process.pod_logs.receiver]

          file_match {
            enabled = true
          }
        }

        loki.process "pod_logs" {
          // CRI line format: timestamp, stream, flags and message. Joins partial lines and adds the stream label.
          stage.cri {}

          // loki.source.file adds a filename label with the file path. It repeats namespace, pod and container
          // and changes on every container restart, so it only creates extra streams. Only the label is removed;
          // no log line is dropped.
          stage.label_drop {
            values = ["filename"]
          }

          forward_to = [loki.write.default.receiver]
        }

        loki.write "default" {
          endpoint {
            url = "http://loki-gateway.logging.svc/loki/api/v1/push"
          }
        }

  controller:
    type: daemonset
    # Collect from every node, including control plane nodes and nodes with other NoSchedule taints.
    tolerations:
      - operator: Exists
        effect: NoSchedule
    volumes:
      extra:
        - name: alloy-data
          hostPath:
            path: /var/lib/alloy-logging
            type: DirectoryOrCreate

  configReloader:
    resources:
      requests:
        cpu: 10m
        memory: 32Mi
      limits:
        memory: 64Mi

  # The upstream rule set also grants read access to Secrets and ConfigMaps in every namespace.
  # This chart ships a pods-only ClusterRole instead (templates/alloy-rbac.yaml).
  rbac:
    create: false
  serviceAccount:
    create: true

  # Requires the monitoring toolchain (Prometheus selects release=monitoring in every namespace).
  serviceMonitor:
    enabled: true
    additionalLabels:
      release: monitoring
