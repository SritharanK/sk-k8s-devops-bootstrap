# LimitRange + ResourceQuota per namespace. Adjust values to your cluster size.
apiVersion: v1
kind: LimitRange
metadata:
  name: default
  namespace: prod
spec:
  limits:
    - default:
        cpu: "500m"
        memory: "256Mi"
      defaultRequest:
        cpu: "100m"
        memory: "128Mi"
      max:
        cpu: "2"
        memory: "2Gi"
      type: Container
---
apiVersion: v1
kind: LimitRange
metadata:
  name: default
  namespace: dev
spec:
  limits:
    - default:
        cpu: "500m"
        memory: "256Mi"
      defaultRequest:
        cpu: "100m"
        memory: "128Mi"
      max:
        cpu: "2"
        memory: "2Gi"
      type: Container
---
apiVersion: v1
kind: ResourceQuota
metadata:
  name: default
  namespace: prod
spec:
  hard:
    requests.cpu: "10"
    requests.memory: 20Gi
    limits.cpu: "20"
    limits.memory: 40Gi
    pods: "50"
---
apiVersion: v1
kind: ResourceQuota
metadata:
  name: default
  namespace: dev
spec:
  hard:
    requests.cpu: "5"
    requests.memory: 10Gi
    limits.cpu: "10"
    limits.memory: 20Gi
    pods: "30"
