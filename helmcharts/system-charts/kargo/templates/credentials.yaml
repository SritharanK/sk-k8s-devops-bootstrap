{{- /*
Repository credentials for every Kargo Project, in the shared resources
namespace, from the platform secret store (reference profile). The secret
store entry holds username and password; repoURL and the Kargo label come
from values, so the store holds no Kargo-specific data.
*/ -}}
{{- with .Values.credentials }}
{{- if .externalSecret.enabled }}
{{- $ns := $.Values.kargo.global.sharedResources.namespace }}
{{- $creds := list (dict "name" "kargo-git" "type" "git" "repoURL" (required "credentials.git.repoURL is required" .git.repoURL) "regex" false "remoteKey" .git.remoteKey) }}
{{- if .image.enabled }}
{{- $creds = append $creds (dict "name" "kargo-image" "type" "image" "repoURL" (required "credentials.image.repoURL is required" .image.repoURL) "regex" true "remoteKey" .image.remoteKey) }}
{{- end }}
{{- range $c := $creds }}
---
apiVersion: external-secrets.io/v1
kind: ExternalSecret
metadata:
  name: {{ $c.name }}
  namespace: {{ $ns }}
  labels:
    {{- include "kargo-platform.labels" $ | nindent 4 }}
  annotations:
    argocd.argoproj.io/sync-options: SkipDryRunOnMissingResource=true
spec:
  refreshInterval: {{ $.Values.credentials.externalSecret.refreshInterval }}
  secretStoreRef:
    {{- toYaml $.Values.credentials.externalSecret.secretStoreRef | nindent 4 }}
  target:
    name: {{ $c.name }}
    creationPolicy: Owner
    template:
      metadata:
        labels:
          kargo.akuity.io/cred-type: {{ $c.type }}
      data:
        repoURL: {{ $c.repoURL | quote }}
        {{- if $c.regex }}
        repoURLIsRegex: "true"
        {{- end }}
        username: {{ "{{ .username }}" | quote }}
        password: {{ "{{ .password }}" | quote }}
  data:
    - secretKey: username
      remoteRef:
        key: {{ $c.remoteKey }}
        property: username
    - secretKey: password
      remoteRef:
        key: {{ $c.remoteKey }}
        property: password
{{- end }}
{{- end }}
{{- end }}
