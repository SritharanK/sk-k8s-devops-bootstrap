{{- /*
HTTPRoute for the Kargo API and UI on the shared Gateway platform. TLS
terminates at the Gateway listener; the API serves plain HTTP on the Service
port 80 (kargo.api.tls.enabled: false, terminatedUpstream: true) and builds
its own URLs with https.
*/ -}}
{{- if .Values.route.enabled -}}
{{- $api := .Values.kargo.api -}}
{{- if $api.tls.enabled -}}
{{- fail "route.enabled requires kargo.api.tls.enabled=false: TLS terminates at the Gateway" -}}
{{- end -}}
{{- if not $api.host -}}
{{- fail "route.enabled requires kargo.api.host" -}}
{{- end -}}
{{- if not .Values.route.parentRefs -}}
{{- fail "route.enabled requires route.parentRefs" -}}
{{- end -}}
apiVersion: gateway.networking.k8s.io/v1
kind: HTTPRoute
metadata:
  name: kargo-api
  namespace: {{ .Release.Namespace }}
  labels:
    {{- include "kargo-platform.labels" . | nindent 4 }}
  {{- with .Values.route.annotations }}
  annotations:
    {{- toYaml . | nindent 4 }}
  {{- end }}
spec:
  parentRefs:
    {{- toYaml .Values.route.parentRefs | nindent 4 }}
  hostnames:
    - {{ $api.host | quote }}
  rules:
    - matches:
        - path:
            type: PathPrefix
            value: /
      backendRefs:
        - group: ""
          kind: Service
          name: kargo-api
          port: 80
          weight: 1
{{- end }}
