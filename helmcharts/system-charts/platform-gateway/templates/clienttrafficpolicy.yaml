apiVersion: gateway.envoyproxy.io/v1alpha1
kind: ClientTrafficPolicy
metadata:
  name: {{ .Values.gateway.name }}-edge
  namespace: {{ .Release.Namespace }}
  labels:
    {{- include "platform-gateway.labels" . | nindent 4 }}
  annotations:
    {{- include "platform-gateway.annotations" . | nindent 4 }}
spec:
  targetRefs:
    - group: gateway.networking.k8s.io
      kind: Gateway
      name: {{ .Values.gateway.name }}
  headers:
    withUnderscoresAction: {{ .Values.clientTraffic.headersWithUnderscores }}
  tls:
    minVersion: {{ .Values.clientTraffic.tlsMinVersion | quote }}
  {{- with .Values.clientTraffic.xForwardedFor }}
  clientIPDetection:
    xForwardedFor:
      {{- toYaml . | nindent 6 }}
  {{- end }}
