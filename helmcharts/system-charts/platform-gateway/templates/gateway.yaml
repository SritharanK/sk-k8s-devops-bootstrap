{{- $domain := include "platform-gateway.domain" . -}}
apiVersion: gateway.networking.k8s.io/v1
kind: Gateway
metadata:
  name: {{ .Values.gateway.name }}
  namespace: {{ .Release.Namespace }}
  labels:
    {{- include "platform-gateway.labels" . | nindent 4 }}
  annotations:
    {{- include "platform-gateway.annotations" . | nindent 4 }}
spec:
  gatewayClassName: {{ .Values.gatewayClass.name }}
  listeners:
    - name: http
      protocol: HTTP
      port: 80
      allowedRoutes:
        namespaces:
          from: {{ .Values.gateway.httpAllowedRoutes }}
    - name: https
      protocol: HTTPS
      port: 443
      hostname: {{ printf "*.%s" $domain | quote }}
      tls:
        mode: Terminate
        certificateRefs:
          - kind: Secret
            group: ""
            name: {{ .Values.gateway.certificate.secretName }}
      allowedRoutes:
        namespaces:
          from: {{ .Values.gateway.httpsAllowedRoutes }}
