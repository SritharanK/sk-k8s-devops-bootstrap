# Common values for both profiles. Upstream values are nested under `falco`
# (the dependency name); the Falco configuration itself sits one level deeper
# under `falco.falco` (rendered into /etc/falco/falco.yaml).
# Upstream reference: https://github.com/falcosecurity/charts/blob/falco-9.2.2/charts/falco/values.yaml
falco:
  # Image tag defaults to the chart appVersion: docker.io/falcosecurity/falco:0.45.2.
  image:
    pullPolicy: IfNotPresent

  # DaemonSet on every node, including tainted control-plane nodes, so that no
  # node runs without detection.
  tolerations:
    - operator: Exists

  driver:
    enabled: true
    # CO-RE probe compiled into the Falco binary: no kernel module, no driver
    # download, no driver loader init container. Needs a kernel with BTF (see README).
    kind: modern_ebpf
    modernEbpf:
      # Privileged mode (upstream default). The least-privileged variant needs
      # AppArmor and SELinux to allow bpf() for a non-privileged container,
      # which differs per node OS. See README "Known limitations".
      leastPrivileged: false

  collectors:
    enabled: true
    containerEngine:
      enabled: true
      # Uses the container plugin bundled in the image (libcontainer.so 0.7.6).
      # Docker and Podman are off: kind and RKE2 nodes run containerd, and the
      # Docker engine would mount the whole host /var/run into the pod.
      engines:
        docker:
          enabled: false
        podman:
          enabled: false
    # The k8smeta plugin needs the separate k8s-metacollector; the container
    # plugin already adds pod name, namespace and labels from the CRI.
    kubernetes:
      enabled: false

  # Deterministic rules: no falcoctl. Upstream would install and follow the
  # floating OCI tag falco-rules:5 and the container plugin at every pod start.
  # Falco 0.45.2 ships falco-rules 5.2.0 in /etc/falco/falco_rules.yaml and the
  # container plugin in /usr/share/falco/plugins, so rule and plugin versions
  # change only with the image. Local rules go into `customRules` below.
  falcoctl:
    artifact:
      install:
        enabled: false
      follow:
        enabled: false

  # Platform-specific rules and exceptions, mounted into /etc/falco/rules.d.
  # Example:
  #   customRules:
  #     platform-exceptions.yaml: |-
  #       - rule: Terminal shell in container
  #         exceptions: ...
  customRules: {}

  falcosidekick:
    enabled: false

  # Prometheus endpoint on the embedded webserver (port 8765, Service falco-metrics).
  # Requires the monitoring toolchain: its Prometheus selects `release: monitoring`.
  metrics:
    enabled: true
  serviceMonitor:
    create: true
    labels:
      release: monitoring
    interval: 30s

  falco:
    # Alerts go to stdout as JSON, one object per line. The logging toolchain
    # (Alloy) collects the container log and ships it to Loki.
    json_output: true
    json_include_output_property: true
    json_include_tags_property: true
    stdout_output:
      enabled: true
    # No syslog daemon inside the container.
    syslog_output:
      enabled: false
    log_syslog: false
    log_stderr: true
