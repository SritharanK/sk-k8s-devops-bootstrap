{{- /*
  plans.upgrade.cattle.io, rendered from the unchanged upstream file upstream/crd.yaml.
  Only the Argo CD sync options Prune=false,Delete=false are added, so Argo CD never prunes or deletes
  the CRD, also not when the toolchain is switched off.
*/}}
{{- $crd := .Files.Get "upstream/crd.yaml" | fromYaml }}
{{- if not $crd.metadata }}
{{- fail "upstream/crd.yaml is missing or empty; check .helmignore" }}
{{- end }}
{{- $annotations := default dict $crd.metadata.annotations }}
{{- $_ := set $annotations "argocd.argoproj.io/sync-options" "Prune=false,Delete=false" }}
{{- $_ := set $crd.metadata "annotations" $annotations }}
{{ toYaml $crd }}
