{{- /*
External Secrets store backed by this OpenBao cluster. Sync wave 1: Argo CD
applies it after the StatefulSet (wave 0) is healthy, which requires every
pod to be initialised and unsealed. The CRD comes from the external-secrets
Application.
*/ -}}
{{- if .Values.clusterSecretStore.enabled -}}
{{- $fullname := include "openbao-wrapper.fullname" . -}}
{{- $store := .Values.clusterSecretStore -}}
apiVersion: external-secrets.io/v1
kind: ClusterSecretStore
metadata:
  name: {{ $store.name }}
  labels:
    {{- include "openbao-wrapper.labels" . | nindent 4 }}
    app.kubernetes.io/component: secret-store
  annotations:
    argocd.argoproj.io/sync-options: SkipDryRunOnMissingResource=true
    argocd.argoproj.io/sync-wave: "1"
spec:
  {{- with $store.conditions }}
  conditions:
    {{- toYaml . | nindent 4 }}
  {{- end }}
  provider:
    openBao:
      server: {{ printf "https://%s-active.%s.svc:%v" $fullname .Release.Namespace .Values.openbao.server.service.port }}
      path: {{ $store.kv.path }}
      version: {{ $store.kv.version }}
      caProvider:
        type: Secret
        name: {{ .Values.tls.secretName }}
        key: ca.crt
        namespace: {{ .Release.Namespace }}
      auth:
        kubernetes:
          path: {{ $store.auth.mountPath }}
          role: {{ $store.auth.role }}
          serviceAccountRef:
            name: {{ $store.auth.serviceAccount.name }}
            namespace: {{ $store.auth.serviceAccount.namespace }}
{{- end }}
