# Wrapper values (templates/ of this chart).

# Server certificate for the OpenBao listener, issued by cert-manager
# (templates/certificate.yaml). The issuer must put ca.crt in the Secret: the
# listener, Raft retry_join, the CLI and the ClusterSecretStore all trust it.
tls:
  issuerRef:
    name: selfsigned
    kind: ClusterIssuer
    group: cert-manager.io
  # Must match the "tls" volume in openbao.server.volumes (checked by
  # templates/guards.yaml).
  secretName: openbao-server-tls
  clusterDomain: cluster.local
  # The listener sets tls_auto_reload, so renewed files are picked up without
  # a restart or SIGHUP.
  duration: 8760h    # 1 year
  renewBefore: 720h  # 30 days

# External Secrets ClusterSecretStore backed by this OpenBao cluster
# (templates/clustersecretstore.yaml). It becomes Ready once the KV mount,
# the Kubernetes auth method and the role exist (README runbook).
clusterSecretStore:
  enabled: false
  name: openbao
  kv:
    path: secret
    version: v2
  auth:
    mountPath: kubernetes
    role: external-secrets
    serviceAccount:
      name: external-secrets
      namespace: external-secrets
  # spec.conditions of the store. Empty means every namespace may reference
  # the store; restrict with namespaceSelector or namespaces when tenants
  # must not read each other's paths.
  conditions: []

# Upstream globals. TLS is required end to end (checked by
# templates/guards.yaml); this also switches probes, BAO_ADDR and service port
# names to https.
global:
  tlsDisable: false

# Owner values for the upstream openbao chart.
openbao:
  # Predictable names: openbao, openbao-active, openbao-standby,
  # openbao-internal, openbao-ui, pods openbao-<n>.
  fullnameOverride: openbao

  # External Secrets is the only consumer; no agent injector, no CSI provider.
  injector:
    enabled: false
  csi:
    enabled: false

  # UI Service, ClusterIP only. Reach it with kubectl port-forward.
  ui:
    enabled: true
    serviceType: ClusterIP
    activeOpenbaoPodOnly: true

  server:
    # Dev mode keeps everything in memory with a known root token. Never
    # allowed (checked by templates/guards.yaml).
    dev:
      enabled: false

    # Pods start together so each can be unsealed in any order. OrderedReady
    # would hold pod n+1 until pod n is unsealed. Immutable after creation.
    podManagementPolicy: Parallel
    # Upstream default, kept explicit: pods are replaced only when deleted,
    # one at a time (README upgrade notes).
    updateStrategyType: OnDelete
    # Annotates pods with a config checksum, so pods still running an old
    # configuration are visible under OnDelete.
    configAnnotation: true

    resources:
      requests:
        cpu: 250m
        memory: 256Mi
      limits:
        cpu: "1"
        memory: 512Mi

    # Pod Security Standards "restricted". Setting these replaces the upstream
    # defaults, whose container context lacks capabilities.drop.
    statefulSet:
      securityContext:
        pod:
          runAsNonRoot: true
          runAsUser: 100    # openbao user in the image
          runAsGroup: 1000  # openbao group in the image
          fsGroup: 1000
          fsGroupChangePolicy: OnRootMismatch
          seccompProfile:
            type: RuntimeDefault
        container:
          allowPrivilegeEscalation: false
          readOnlyRootFilesystem: true
          capabilities:
            drop:
              - ALL

    # Server certificate from templates/certificate.yaml, and a writable /tmp:
    # the entrypoint copies the rendered config to /tmp before start.
    volumes:
      - name: tls
        secret:
          secretName: openbao-server-tls
      - name: tmp
        emptyDir: {}
    volumeMounts:
      - name: tls
        mountPath: /openbao/tls
        readOnly: true
      - name: tmp
        mountPath: /tmp
    extraEnvironmentVars:
      # CA for the bao CLI inside the pod (BAO_ADDR is https://127.0.0.1:8200,
      # covered by the IP SAN of the certificate).
      BAO_CACERT: /openbao/tls/ca.crt

    # Upstream readiness probe (exec "bao status") reports ready only when the
    # node is initialised and unsealed.
    readinessProbe:
      enabled: true
    # Sealed and uninitialised nodes answer 204, so liveness only fails on a
    # hung process and never restarts a pod waiting to be unsealed.
    livenessProbe:
      enabled: true
      path: /v1/sys/health?standbyok=true&sealedcode=204&uninitcode=204
      initialDelaySeconds: 60

    # Raft data. storageClass null uses the cluster default StorageClass; set
    # a name to pin one.
    dataStorage:
      enabled: true
      storageClass: null
    # Keep Raft and audit volumes when the StatefulSet is deleted or scaled
    # down.
    persistentVolumeClaimRetentionPolicy:
      whenDeleted: Retain
      whenScaled: Retain

    # Lets the OpenBao ServiceAccount call the TokenReview API for the
    # Kubernetes auth method (ClusterRoleBinding to system:auth-delegator).
    authDelegator:
      enabled: true

    ha:
      enabled: true
      # Per-pod DNS name instead of the pod IP, so redirects to the active
      # node match the certificate. Assumes fullnameOverride openbao.
      # BAO_K8S_POD_NAME is defined earlier in the container env, which
      # Kubernetes requires for $(VAR) expansion.
      apiAddr: https://$(BAO_K8S_POD_NAME).openbao-internal:8200
      raft:
        enabled: true
        # Raft node ID = pod name, readable in "bao operator raft list-peers".
        setNodeId: true
        # Wrapper key, not an upstream value: an HCL seal stanza appended to
        # the config below. Empty means Shamir (manual) unseal.
        sealConfig: ""
        # Rendered with tpl in the subchart context. retry_join gets one block
        # per replica. The upstream entrypoint substitutes the literal tokens
        # HOST_IP, POD_IP, HOSTNAME, API_ADDR, TRANSIT_ADDR and RAFT_ADDR in
        # this text, so they must not appear in it.
        config: |
          ui = true

          # No disable_mlock: OpenBao 2.0 removed mlock (openbao/openbao#363),
          # so the container needs no IPC_LOCK capability.

          listener "tcp" {
            address            = "[::]:8200"
            cluster_address    = "[::]:8201"
            tls_disable        = 0
            tls_cert_file      = "/openbao/tls/tls.crt"
            tls_key_file       = "/openbao/tls/tls.key"
            tls_client_ca_file = "/openbao/tls/ca.crt"
            # Reload certificate and key when cert-manager renews the Secret.
            tls_auto_reload    = true
          }

          storage "raft" {
            path = "/openbao/data"
          {{- $fullname := include "openbao.fullname" . }}
          {{- range $i := until (int .Values.server.ha.replicas) }}

            retry_join {
              leader_api_addr       = "https://{{ $fullname }}-{{ $i }}.{{ $fullname }}-internal:8200"
              leader_ca_cert_file   = "/openbao/tls/ca.crt"
              leader_tls_servername = "{{ $fullname }}-{{ $i }}.{{ $fullname }}-internal"
            }
          {{- end }}
          }

          service_registration "kubernetes" {}
          {{- if eq (toString .Values.server.auditStorage.enabled) "true" }}

          # File audit device on the audit volume. Declared here because
          # OpenBao refuses audit devices created through the API by default
          # (unsafe_allow_api_audit_creation = false).
          audit "file" "file" {
            options {
              file_path = "{{ .Values.server.auditStorage.mountPath }}/audit.log"
            }
          }
          {{- end }}
          {{- with .Values.server.ha.raft.sealConfig }}

          {{ . }}
          {{- end }}
