{{- /*
ExternalSecrets for the reference profile. Sync wave -1 so the Secrets exist before
Grafana and Alertmanager start. In lab the Secrets are created out of band (README).
*/}}
{{- $grafana := index .Values "kube-prometheus-stack" "grafana" }}
{{- with .Values.grafanaAdmin.externalSecret }}
{{- if .enabled }}
---
apiVersion: external-secrets.io/v1
kind: ExternalSecret
metadata:
  name: {{ $grafana.admin.existingSecret }}
  namespace: {{ $.Release.Namespace }}
  labels:
    {{- include "monitoring.labels" $ | nindent 4 }}
  annotations:
    argocd.argoproj.io/sync-wave: "-1"
spec:
  refreshInterval: {{ .refreshInterval }}
  secretStoreRef:
    {{- toYaml .secretStoreRef | nindent 4 }}
  target:
    name: {{ $grafana.admin.existingSecret }}
    creationPolicy: Owner
  data:
    - secretKey: {{ $grafana.admin.userKey }}
      remoteRef:
        key: {{ .remoteKey }}
        property: {{ $grafana.admin.userKey }}
    - secretKey: {{ $grafana.admin.passwordKey }}
      remoteRef:
        key: {{ .remoteKey }}
        property: {{ $grafana.admin.passwordKey }}
{{- end }}
{{- end }}
{{- with .Values.alertmanagerReceivers }}
{{- if .externalSecret.enabled }}
---
apiVersion: external-secrets.io/v1
kind: ExternalSecret
metadata:
  name: {{ .secretName }}
  namespace: {{ $.Release.Namespace }}
  labels:
    {{- include "monitoring.labels" $ | nindent 4 }}
  annotations:
    argocd.argoproj.io/sync-wave: "-1"
spec:
  refreshInterval: {{ .externalSecret.refreshInterval }}
  secretStoreRef:
    {{- toYaml .externalSecret.secretStoreRef | nindent 4 }}
  target:
    name: {{ .secretName }}
    creationPolicy: Owner
  data:
    {{- range list "default-webhook-url" "critical-webhook-url" "heartbeat-webhook-url" }}
    - secretKey: {{ . }}
      remoteRef:
        key: {{ $.Values.alertmanagerReceivers.externalSecret.remoteKey }}
        property: {{ . }}
    {{- end }}
{{- end }}
{{- end }}
