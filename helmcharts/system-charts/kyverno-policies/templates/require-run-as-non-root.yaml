apiVersion: kyverno.io/v1
kind: ClusterPolicy
metadata:
  name: require-run-as-non-root
spec:
  validationFailureAction: Enforce
  background: false
  rules:
    - name: require-run-as-non-root
      match:
        any:
          - resources:
              kinds:
                - Pod
              namespaces:
                {{- range .Values.enforcedNamespaces }}
                - {{ . }}
                {{- end }}
      validate:
        message: "Pods must run as non-root (securityContext.runAsNonRoot: true or runAsUser != 0)."
        pattern:
          spec:
            securityContext:
              runAsNonRoot: true
            containers:
              - securityContext:
                  runAsNonRoot: true
