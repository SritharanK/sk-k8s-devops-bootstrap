# Fixtures for the workload policies.
# good-*: compliant objects that must pass every policy.
# bad-*: compliant objects with exactly one violation, unless the name says
# otherwise. Objects in prod are checked by the *-enforce policies, objects in
# dev by the *-audit policies.
---
apiVersion: v1
kind: Pod
metadata:
  name: good-pod
  namespace: prod
spec:
  automountServiceAccountToken: false
  securityContext:
    runAsNonRoot: true
    runAsUser: 65532
    runAsGroup: 65532
    seccompProfile:
      type: RuntimeDefault
  initContainers:
    - name: init
      image: ghcr.io/your-org/hello-api:1.0.0
      command: [/hello-api, --check-config]
      securityContext:
        runAsNonRoot: true
        allowPrivilegeEscalation: false
        readOnlyRootFilesystem: true
        capabilities:
          drop: [ALL]
      resources:
        requests: {cpu: 10m, memory: 16Mi}
        limits: {cpu: 50m, memory: 32Mi}
  containers:
    - name: app
      image: ghcr.io/your-org/hello-api:1.0.0
      ports:
        - name: http
          containerPort: 8080
      securityContext:
        runAsNonRoot: true
        allowPrivilegeEscalation: false
        readOnlyRootFilesystem: true
        capabilities:
          drop: [ALL]
      resources:
        requests: {cpu: 50m, memory: 64Mi}
        limits: {cpu: 200m, memory: 128Mi}
      readinessProbe:
        httpGet: {path: /readyz, port: http}
      livenessProbe:
        httpGet: {path: /healthz, port: http}
      volumeMounts:
        - name: tmp
          mountPath: /tmp
  volumes:
    - name: tmp
      emptyDir:
        sizeLimit: 64Mi
---
