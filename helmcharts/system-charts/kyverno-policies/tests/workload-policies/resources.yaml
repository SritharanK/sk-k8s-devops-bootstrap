# cert-manager ACME HTTP-01 solver pod as created by the controller: covered
# by the acme-http01-solver PolicyException.
apiVersion: v1
kind: Pod
metadata:
  name: cm-acme-http-solver-abcde
  namespace: prod
  labels:
    acme.cert-manager.io/http-domain: "1234567890"
    acme.cert-manager.io/http-token: "1234567890"
    acme.cert-manager.io/http01-solver: "true"
  ownerReferences:
    - apiVersion: acme.cert-manager.io/v1
      kind: Challenge
      name: hello-api-tls-1-2345678901-1234567890
      uid: 00000000-0000-0000-0000-000000000002
      controller: true
      blockOwnerDeletion: true
spec:
  restartPolicy: OnFailure
  securityContext:
    runAsNonRoot: true
    seccompProfile:
      type: RuntimeDefault
  containers:
    - name: acmesolver
      image: quay.io/jetstack/cert-manager-acmesolver:v1.19.1
      args:
        - --listen-port=8089
        - --domain=hello-api.prod.localtest.me
        - --token=TOKEN
        - --key=KEY
      ports:
        - name: http
          containerPort: 8089
      securityContext:
        allowPrivilegeEscalation: false
        capabilities:
          drop: [ALL]
      resources:
        requests: {cpu: 10m, memory: 64Mi}
        limits: {cpu: 100m, memory: 64Mi}
---
# A pod that copies the solver label but runs another image: not exempt.
apiVersion: v1
kind: Pod
metadata:
  name: bad-fake-acme-solver
  namespace: prod
  labels:
    acme.cert-manager.io/http01-solver: "true"
  ownerReferences:
    - apiVersion: acme.cert-manager.io/v1
      kind: Challenge
      name: fake
      uid: 00000000-0000-0000-0000-000000000003
spec:
  containers:
    - name: app
      image: docker.io/library/busybox:1.37.0
