        variables.podSpec.containers +
        variables.podSpec.?initContainers.orValue([]) +
        variables.podSpec.?ephemeralContainers.orValue([])
    - expression: '["ghcr.io/your-org/"]'
      name: allowedRegistries
  validations:
    - expression: variables.containers.all(c, variables.allowedRegistries.exists(r, c.image.startsWith(r)))
      message: 'Images must come from an allowed registry: ghcr.io/your-org/'


