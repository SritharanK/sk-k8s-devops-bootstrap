apiVersion: policies.kyverno.io/v1
kind: ValidatingPolicy
metadata:
  name: require-requests-limits-audit
  labels:
    app.kubernetes.io/managed-by: Helm
    app.kubernetes.io/part-of: platform
    app.kubernetes.io/instance: kyverno-policies
    helm.sh/chart: kyverno-policies-2.1.0
  annotations:
    argocd.argoproj.io/sync-options: SkipDryRunOnMissingResource=true
    policies.kyverno.io/title: "Require CPU and memory requests and limits"
    policies.kyverno.io/category: "Workload Contract"
    policies.kyverno.io/severity: "medium"
    policies.kyverno.io/subject: "Pod"
    policies.kyverno.io/description: "Every regular and init container must declare CPU and memory requests and limits. Ephemeral containers cannot declare resources and are not checked."
spec:
  validationActions: [Audit, Warn]
  failurePolicy: Ignore
  evaluation:
    admission:
      enabled: true
    background:
      enabled: true
  matchConstraints:
    namespaceSelector:
      matchExpressions:
        - key: kubernetes.io/metadata.name
          operator: In
          values:
            - dev
    resourceRules:
      - apiGroups: [""]
        apiVersions: [v1]
        operations: [CREATE, UPDATE]
        resources: [pods]
      - apiGroups: [""]
        apiVersions: [v1]
        operations: [UPDATE]
        resources: [pods/ephemeralcontainers]
      - apiGroups: [apps]
        apiVersions: [v1]
        operations: [CREATE, UPDATE]
        resources: [deployments, statefulsets, daemonsets]
      - apiGroups: [batch]
        apiVersions: [v1]
        operations: [CREATE, UPDATE]
        resources: [jobs, cronjobs]
  variables:
    - name: podSpec
      expression: >-
        object.kind == 'Pod' ? object.spec :
        (object.kind == 'CronJob' ? object.spec.jobTemplate.spec.template.spec : object.spec.template.spec)
    - name: containers
      expression: >-
        variables.podSpec.containers +
        variables.podSpec.?initContainers.orValue([]) +
        variables.podSpec.?ephemeralContainers.orValue([])
    - expression: variables.podSpec.containers + variables.podSpec.?initContainers.orValue([])
      name: sizedContainers
  validations:
    - expression: variables.sizedContainers.all(c, ['cpu', 'memory'].all(r, r in c.?resources.?requests.orValue({})))
      message: Every container and init container must set resources.requests for cpu
        and memory.
    - expression: variables.sizedContainers.all(c, ['cpu', 'memory'].all(r, r in c.?resources.?limits.orValue({})))
      message: Every container and init container must set resources.limits for cpu and
        memory.


