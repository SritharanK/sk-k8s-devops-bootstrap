# Source: kyverno-policies/templates/validatingpolicies.yaml
apiVersion: policies.kyverno.io/v1
kind: ValidatingPolicy
metadata:
  name: require-image-tag-or-digest-audit
  labels:
    app.kubernetes.io/managed-by: Helm
    app.kubernetes.io/part-of: platform
    app.kubernetes.io/instance: kyverno-policies
    helm.sh/chart: kyverno-policies-2.1.0
  annotations:
    argocd.argoproj.io/sync-options: SkipDryRunOnMissingResource=true
    policies.kyverno.io/title: "Require an immutable image reference"
    policies.kyverno.io/category: "Supply Chain"
    policies.kyverno.io/severity: "medium"
    policies.kyverno.io/subject: "Pod"
    policies.kyverno.io/description: "Every image must carry an explicit tag other than latest, or a sha256 digest. The tag is read after the last slash, so a registry port is not mistaken for a tag."
spec:
  validationActions: [Audit, Warn]
  failurePolicy: Ignore
  evaluation:
    admission:
      enabled: true
    background:
      enabled: true
  matchConstraints:
    namespaceSelector:
      matchExpressions:
        - key: kubernetes.io/metadata.name
          operator: In
          values:
            - dev
    resourceRules:
      - apiGroups: [""]
        apiVersions: [v1]
        operations: [CREATE, UPDATE]
        resources: [pods]
      - apiGroups: [""]
        apiVersions: [v1]
        operations: [UPDATE]
        resources: [pods/ephemeralcontainers]
      - apiGroups: [apps]
        apiVersions: [v1]
        operations: [CREATE, UPDATE]
        resources: [deployments, statefulsets, daemonsets]
      - apiGroups: [batch]
        apiVersions: [v1]
        operations: [CREATE, UPDATE]
        resources: [jobs, cronjobs]
  variables:
    - name: podSpec
      expression: >-
        object.kind == 'Pod' ? object.spec :
        (object.kind == 'CronJob' ? object.spec.jobTemplate.spec.template.spec : object.spec.template.spec)
    - name: containers
      expression: >-
        variables.podSpec.containers +
        variables.podSpec.?initContainers.orValue([]) +
        variables.podSpec.?ephemeralContainers.orValue([])
  validations:
    - expression: variables.containers.all(c, c.image.matches('@sha256:[a-f0-9]{64}$')
        || c.image.substring(c.image.lastIndexOf('/') + 1).contains(':'))
      message: Every image must carry an explicit tag or a sha256 digest.
    - expression: variables.containers.all(c, c.image.matches('@sha256:[a-f0-9]{64}$')
        || !c.image.endsWith(':latest'))
      message: The latest tag is not allowed; use an immutable tag or a digest.


