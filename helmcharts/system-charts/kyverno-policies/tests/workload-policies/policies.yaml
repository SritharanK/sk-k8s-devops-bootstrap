    - name: containers
      expression: >-
        variables.podSpec.containers +
        variables.podSpec.?initContainers.orValue([]) +
        variables.podSpec.?ephemeralContainers.orValue([])
  validations:
    - expression: variables.containers.all(c, c.?securityContext.?readOnlyRootFilesystem.orValue(false)
        == true)
      message: readOnlyRootFilesystem must be true in every container; mount an emptyDir
        for writable paths.


