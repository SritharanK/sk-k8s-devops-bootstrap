apiVersion: policies.kyverno.io/v1
kind: ValidatingPolicy
metadata:
  name: require-run-as-non-root-audit
  labels:
    app.kubernetes.io/managed-by: Helm
    app.kubernetes.io/part-of: platform
    app.kubernetes.io/instance: kyverno-policies
    helm.sh/chart: kyverno-policies-2.1.0
  annotations:
    argocd.argoproj.io/sync-options: SkipDryRunOnMissingResource=true
    policies.kyverno.io/title: "Require non-root containers"
    policies.kyverno.io/category: "Pod Security"
    policies.kyverno.io/severity: "high"
    policies.kyverno.io/subject: "Pod"
    policies.kyverno.io/description: "Every container must run with runAsNonRoot true, set on the container or inherited from the pod, and no securityContext may set runAsUser to 0."
spec:
  validationActions: [Audit, Warn]
  failurePolicy: Ignore
  evaluation:
    admission:
      enabled: true
    background:
      enabled: true
  matchConstraints:
    namespaceSelector:
      matchExpressions:
        - key: kubernetes.io/metadata.name
          operator: In
          values:
            - dev
    resourceRules:
      - apiGroups: [""]
        apiVersions: [v1]
        operations: [CREATE, UPDATE]
        resources: [pods]
      - apiGroups: [""]
        apiVersions: [v1]
        operations: [UPDATE]
        resources: [pods/ephemeralcontainers]
      - apiGroups: [apps]
        apiVersions: [v1]
        operations: [CREATE, UPDATE]
        resources: [deployments, statefulsets, daemonsets]
      - apiGroups: [batch]
        apiVersions: [v1]
        operations: [CREATE, UPDATE]
        resources: [jobs, cronjobs]
  variables:
    - name: podSpec
      expression: >-
        object.kind == 'Pod' ? object.spec :
        (object.kind == 'CronJob' ? object.spec.jobTemplate.spec.template.spec : object.spec.template.spec)
    - name: containers
      expression: >-
        variables.podSpec.containers +
        variables.podSpec.?initContainers.orValue([]) +
        variables.podSpec.?ephemeralContainers.orValue([])
  validations:
    - expression: variables.containers.all(c, c.?securityContext.?runAsNonRoot.orValue(
        variables.podSpec.?securityContext.?runAsNonRoot.orValue(false)) == true)
      message: runAsNonRoot must be true for every container, including init and ephemeral
        containers, set on the container or on the pod securityContext.
    - expression: variables.podSpec.?securityContext.?runAsUser.orValue(1) != 0 && variables.containers.all(c,
        c.?securityContext.?runAsUser.orValue(1) != 0)
      message: runAsUser must not be 0 in the pod or in any container securityContext.


