apiVersion: policies.kyverno.io/v1
kind: ValidatingPolicy
metadata:
  name: require-probes-audit
  labels:
    app.kubernetes.io/managed-by: Helm
    app.kubernetes.io/part-of: platform
    app.kubernetes.io/instance: kyverno-policies
    helm.sh/chart: kyverno-policies-2.1.0
  annotations:
    argocd.argoproj.io/sync-options: SkipDryRunOnMissingResource=true
    policies.kyverno.io/title: "Require readiness and liveness probes"
    policies.kyverno.io/category: "Workload Contract"
    policies.kyverno.io/severity: "medium"
    policies.kyverno.io/subject: "Pod"
    policies.kyverno.io/description: "Every regular container of a long-running workload must define a readinessProbe and a livenessProbe. Jobs, CronJobs and pods owned by a Job run to completion and are not checked."
spec:
  validationActions: [Audit, Warn]
  failurePolicy: Ignore
  evaluation:
    admission:
      enabled: true
    background:
      enabled: true
  matchConstraints:
    namespaceSelector:
      matchExpressions:
        - key: kubernetes.io/metadata.name
          operator: In
          values:
            - dev
    resourceRules:
      - apiGroups: [""]
        apiVersions: [v1]
        operations: [CREATE, UPDATE]
        resources: [pods]
      - apiGroups: [""]
        apiVersions: [v1]
        operations: [UPDATE]
        resources: [pods/ephemeralcontainers]
      - apiGroups: [apps]
        apiVersions: [v1]
        operations: [CREATE, UPDATE]
        resources: [deployments, statefulsets, daemonsets]
      - apiGroups: [batch]
        apiVersions: [v1]
        operations: [CREATE, UPDATE]
        resources: [jobs, cronjobs]
  matchConditions:
    - expression: '!(object.kind in [''Job'', ''CronJob'']) && !(object.kind == ''Pod''
        && object.metadata.?ownerReferences.orValue([]).exists(o, o.kind == ''Job''))'
      name: long-running-workloads
  variables:
    - name: podSpec
      expression: >-
        object.kind == 'Pod' ? object.spec :
        (object.kind == 'CronJob' ? object.spec.jobTemplate.spec.template.spec : object.spec.template.spec)
    - name: containers
      expression: >-
        variables.podSpec.containers +
        variables.podSpec.?initContainers.orValue([]) +
        variables.podSpec.?ephemeralContainers.orValue([])
  validations:
    - expression: variables.podSpec.containers.all(c, has(c.readinessProbe))
      message: Every container must define a readinessProbe.
    - expression: variables.podSpec.containers.all(c, has(c.livenessProbe))
      message: Every container must define a livenessProbe.


