    policies.kyverno.io/severity: "high"
    policies.kyverno.io/subject: "Pod"
    policies.kyverno.io/description: "Every container must drop ALL capabilities and may add back only NET_BIND_SERVICE."
spec:
  validationActions: [Audit, Warn]
  failurePolicy: Ignore
  evaluation:
    admission:
      enabled: true
    background:
      enabled: true
