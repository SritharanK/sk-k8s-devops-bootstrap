# Signed passes, unsigned fails (also as an init container), and images
# outside the verified registries are not checked.
---
apiVersion: cli.kyverno.io/v1alpha1
kind: Test
metadata:
  name: image-verification-trusted-identity
policies: [policies.yaml]
resources: [resources.yaml]
variables: values.yaml
results:
  - isImageValidatingPolicy: true
    policy: verify-image-signatures-enforce
    kind: Pod
    result: pass
    resources: [signed, signed-with-unmatched-image]
  - isImageValidatingPolicy: true
    policy: verify-image-signatures-enforce
    kind: Pod
    result: fail
    resources: [unsigned, unsigned-init]
