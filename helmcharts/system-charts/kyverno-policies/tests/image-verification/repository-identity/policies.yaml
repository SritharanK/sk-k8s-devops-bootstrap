---
# Source: kyverno-policies/templates/imagevalidatingpolicy.yaml
apiVersion: policies.kyverno.io/v1
kind: ImageValidatingPolicy
metadata:
  name: verify-image-signatures-enforce
  labels:
    app.kubernetes.io/managed-by: Helm
    app.kubernetes.io/part-of: platform
    app.kubernetes.io/instance: kyverno-policies
    helm.sh/chart: kyverno-policies-2.1.0
  annotations:
    argocd.argoproj.io/sync-options: SkipDryRunOnMissingResource=true
    policies.kyverno.io/title: "Verify image signatures"
    policies.kyverno.io/category: "Supply Chain"
    policies.kyverno.io/severity: "high"
    policies.kyverno.io/subject: "Pod"
    policies.kyverno.io/description: >-
      Images from the owned registries must carry a cosign keyless signature
      made by the build workflow identity, recorded in the transparency log.
      Matching images are pinned to their digest at admission.
spec:
  validationActions: [Deny]
  failurePolicy: Fail
  webhookConfiguration:
    timeoutSeconds: 30
  evaluation:
    # Signatures are checked at admission. Background re-verification would
    # call the registry and the log for every running pod on each scan.
    background:
      enabled: false
  matchConstraints:
    namespaceSelector:
      matchExpressions:
        - key: kubernetes.io/metadata.name
          operator: In
          values:
            - prod
    resourceRules:
      - apiGroups: [""]
        apiVersions: [v1]
        operations: [CREATE, UPDATE]
        resources: [pods]
  matchImageReferences:
    - glob: "ghcr.io/kyverno/test-images/cosign*"
  validationConfigurations:
    mutateDigest: true
    verifyDigest: true
    required: true
  attestors:
    - name: buildWorkflow
      cosign:
        keyless:
          identities:
            - issuer: "https://token.actions.githubusercontent.com"
              subjectRegExp: "^https://github\\.com/[^/]+/sk-k8s-devops-bootstrap/\\.github/workflows/build-image\\.yml@refs/heads/main$"
        ctlog:
          url: "https://rekor.sigstore.dev"
  variables:
    - name: allImages
      expression: >-
        images.?containers.orValue([]) + images.?initContainers.orValue([]) +
        images.?ephemeralContainers.orValue([])
  validations:
    - expression: >-
        variables.allImages.map(image, verifyImageSignatures(image, [attestors.buildWorkflow])).all(count, count > 0)
      message: >-
        Images from the owned registries must be signed by the build workflow
        of this repository (cosign keyless, GitHub Actions OIDC).


