{{- /*
Takes over the "default" ServiceAccount that Kubernetes creates in every
namespace and stops it from mounting an API token into pods by default. A pod
spec that sets automountServiceAccountToken: true still overrides this.
*/}}
{{- if not .Values.defaultServiceAccount.automountToken }}
{{- range $env, $ns := .Values.environments }}
---
apiVersion: v1
kind: ServiceAccount
metadata:
  name: default
  namespace: {{ $ns }}
  labels:
    {{- include "misc.labels" $ | nindent 4 }}
automountServiceAccountToken: false
{{- end }}
{{- end }}
