apiVersion: argoproj.io/v1alpha1
kind: AppProject
metadata:
  name: {{ .Values.project.name }}
  namespace: argocd
  finalizers:
    - resources-finalizer.argocd.argoproj.io
spec:
  description: "Platform GitOps project — managed by Helm"

  sourceRepos:
    {{- range .Values.project.sourceRepos }}
    - {{ . | quote }}
    {{- end }}

  destinations:
    {{- range .Values.project.destinations }}
    - namespace: {{ .namespace | quote }}
      server: {{ $.Values.project.destinationServer | quote }}
    {{- end }}

  # Minimal cluster-scoped whitelist — only what the bootstrap charts actually create.
  # Namespace: created by misc chart. CRDs: cert-manager, Kyverno, Argo CD install CRDs.
  # Expand this list only when adding a controller that manages cluster-scoped resources.
  clusterResourceWhitelist:
    - group: ""
      kind: "Namespace"
    - group: "apiextensions.k8s.io"
      kind: "CustomResourceDefinition"
    - group: "argoproj.io"
      kind: "AppProject"
    - group: "argoproj.io"
      kind: "Application"
    - group: "rbac.authorization.k8s.io"
      kind: "ClusterRole"
    - group: "rbac.authorization.k8s.io"
      kind: "ClusterRoleBinding"
    - group: "cert-manager.io"
      kind: "ClusterIssuer"
    - group: "kyverno.io"
      kind: "ClusterPolicy"
    # - group: "storage.k8s.io"
    #   kind: "StorageClass"          # Uncomment if bootstrap manages StorageClasses
    # - group: "networking.k8s.io"
    #   kind: "IngressClass"          # Uncomment if bootstrap manages IngressClasses

  namespaceResourceWhitelist:
    - group: "*"
      kind: "*"
