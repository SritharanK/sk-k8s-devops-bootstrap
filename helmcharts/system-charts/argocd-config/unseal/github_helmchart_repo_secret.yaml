########################################################################
# YOU DON'T NEED THIS SECRET IF YOU USE LOCAL HELM COMMON CHART
# THIS SECRET IS AN EXAMPLE IF YOU USE GITHUB PRIVATE REPOSITORY AS HELM REGISTRY
# Set URL and token via your config; do not commit real credentials.
########################################################################
apiVersion: v1
kind: Secret
metadata:
  name: github-helmchart-repo-secret
  namespace: argocd
  labels:
    argocd.argoproj.io/secret-type: repository
stringData:
  type: helm
  url: https://raw.githubusercontent.com/YOUR_ORG/helm-common/main
  password: YOUR_GITHUB_TOKEN
  username: YOUR_GITHUB_TOKEN
  name: helm-common
