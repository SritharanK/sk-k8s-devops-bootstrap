# Template: Docker registry credentials secret (for pulling private images).
#
# This file has NO real URL or credentials. You must create the actual secret yourself.
#
# === How to create the secret (choose one) ===
#
# Option A – Using the script (recommended):
#   1. Copy scripts/misc/.env.example to scripts/misc/.env
#   2. Set in .env: DOCKER_USERNAME, DOCKER_PASSWORD, DOCKER_EMAIL
#      For Docker Hub use DOCKER_SERVER=https://index.docker.io/v1/
#      For another registry set DOCKER_SERVER=https://your-registry.example.com
#   3. Ensure KUBECONFIG points to your cluster and Sealed Secrets controller is running
#   4. Run: scripts/misc/create_k8s_docker_secret_seal.sh
#   5. Copy the generated sealed YAML into helmcharts/system-charts/argocd-config/sealed/dockerhub_secret.yaml
#
# Option B – Using kubectl + kubeseal:
#   kubectl create secret docker-registry dockerhub-secret \
#     --docker-server=https://index.docker.io/v1/ \
#     --docker-username=YOUR_USERNAME \
#     --docker-password=YOUR_PASSWORD \
#     --docker-email=YOUR_EMAIL \
#     --namespace=prod --dry-run=client -o yaml | kubeseal --format=yaml > helmcharts/system-charts/argocd-config/sealed/dockerhub_secret.yaml
#
# Do NOT commit the unseal file with real credentials. Only commit the sealed file in argocd-config/sealed/.
#
apiVersion: v1
kind: Secret
metadata:
  name: dockerhub-secret
  namespace: prod
type: kubernetes.io/dockerconfigjson
stringData:
  .dockerconfigjson: |
    {"auths":{"https://index.docker.io/v1/":{"username":"DOCKER_USERNAME","password":"DOCKER_PASSWORD","email":"DOCKER_EMAIL","auth":"PLACEHOLDER_BASE64_AUTH"}}}
