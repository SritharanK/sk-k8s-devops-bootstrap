########################################################################
# YOU DON'T NEED THIS SECRET IF YOU USE LOCAL HELM COMMON CHART
# THIS SECRET IS AN EXAMPLE IF YOU USE GITLAB AS HELM REGISTRY
# Set URL, username, password via your config; do not commit real credentials.
########################################################################
apiVersion: v1
kind: Secret
metadata:
  name: helmchart-repo-secret
  namespace: argocd
  labels:
    argocd.argoproj.io/secret-type: repository
stringData:
  type: helm
  url: https://git.example.com/api/v4/projects/YOUR_PROJECT_ID/packages/helm/stable
  password: YOUR_GITLAB_PAT
  username: YOUR_GITLAB_USERNAME
  name: helm-common
