{{- /*
Platform namespaces: ingress from pods of the same namespace. Egress is not
restricted there, so no egress rule is needed.
*/}}
{{- range $key, $cfg := .Values.platformNamespaces }}
{{- if and $cfg.enabled $cfg.allowSameNamespace }}
---
apiVersion: networking.k8s.io/v1
kind: NetworkPolicy
metadata:
  name: allow-same-namespace
  namespace: {{ $cfg.namespace }}
  labels:
    {{- include "network-policies.labels" $ | nindent 4 }}
spec:
  podSelector: {}
  policyTypes:
    - Ingress
  ingress:
    - from:
        - podSelector: {}
{{- end }}
{{- end }}
