# Common values for both profiles. Upstream values are nested under `keda`.
# Upstream reference: https://github.com/kedacore/charts/blob/v2.21.0/keda/values.yaml
keda:
  image:
    # Tags default to the chart appVersion (2.21.0); never pulled again once present.
    pullPolicy: IfNotPresent

  crds:
    install: true
    # Argo CD must never prune or delete the CRDs: that would delete every ScaledObject.
    additionalAnnotations:
      argocd.argoproj.io/sync-options: Prune=false,Delete=false

  # The operator generates its own certificates and injects caBundle at runtime.
  # The Argo CD Application ignores those fields (ignoreDifferences).
  certificates:
    autoGenerated: true
    certManager:
      enabled: false

  # Restricted Pod Security: upstream already sets the container fields
  # (non-root, no privilege escalation, drop ALL, RuntimeDefault, read-only root).
  # The pod level adds RuntimeDefault so the whole pod is compliant on its own.
  podSecurityContext:
    operator:
      runAsNonRoot: true
      seccompProfile:
        type: RuntimeDefault
    metricServer:
      runAsNonRoot: true
      seccompProfile:
        type: RuntimeDefault
    webhooks:
      runAsNonRoot: true
      seccompProfile:
        type: RuntimeDefault

  # Requires the monitoring toolchain: its Prometheus selects `release: monitoring`.
  prometheus:
    operator:
      enabled: true
      serviceMonitor:
        enabled: true
        additionalLabels:
          release: monitoring
    metricServer:
      enabled: true
      serviceMonitor:
        enabled: true
        additionalLabels:
          release: monitoring

  # Remove the upstream CPU limits (1 core each). CPU limits are omitted on
  # purpose to avoid throttling; memory limits are set per profile.
  resources:
    operator:
      limits:
        cpu: null
    metricServer:
      limits:
        cpu: null
    webhooks:
      limits:
        cpu: null
