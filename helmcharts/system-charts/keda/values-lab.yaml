# Lab profile: kind or a single node. One replica per component, small requests.
keda:
  operator:
    replicaCount: 1
  metricsServer:
    replicaCount: 1
  webhooks:
    replicaCount: 1

  resources:
    operator:
      requests:
        cpu: 25m
        memory: 96Mi
      limits:
        memory: 384Mi
    metricServer:
      requests:
        cpu: 25m
        memory: 64Mi
      limits:
        memory: 256Mi
    webhooks:
      requests:
        cpu: 10m
        memory: 48Mi
      limits:
        memory: 128Mi
