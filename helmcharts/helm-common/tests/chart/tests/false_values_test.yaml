suite: false and zero values are kept
templates:
  - templates/deployment.yaml
  - templates/serviceaccount.yaml
release:
  name: web
  namespace: dev
tests:
  - it: renders readOnlyRootFilesystem false when opted out
    set:
      securityContext.readOnlyRootFilesystem: false
    asserts:
      - equal:
          path: spec.template.spec.containers[0].securityContext.readOnlyRootFilesystem
          value: false
        template: templates/deployment.yaml
      - equal:
          path: spec.template.spec.containers[0].securityContext.allowPrivilegeEscalation
          value: false
        template: templates/deployment.yaml

  - it: renders pod runAsNonRoot false when opted out
    set:
      podSecurityContext.runAsNonRoot: false
    asserts:
      - equal:
          path: spec.template.spec.securityContext.runAsNonRoot
          value: false
        template: templates/deployment.yaml
      - equal:
          path: spec.template.spec.securityContext.runAsUser
          value: 65532
        template: templates/deployment.yaml

  - it: renders replicaCount 0 as 0
    set:
      replicaCount: 0
    asserts:
      - equal:
          path: spec.replicas
          value: 0
        template: templates/deployment.yaml

  - it: renders terminationGracePeriodSeconds 0 as 0
    set:
      terminationGracePeriodSeconds: 0
    asserts:
      - equal:
          path: spec.template.spec.terminationGracePeriodSeconds
          value: 0
        template: templates/deployment.yaml

  - it: renders automount false on the ServiceAccount and the pod by default
    asserts:
      - equal:
          path: automountServiceAccountToken
          value: false
        template: templates/serviceaccount.yaml
      - equal:
          path: spec.template.spec.automountServiceAccountToken
          value: false
        template: templates/deployment.yaml

  - it: renders automount true on both when enabled
    set:
      serviceAccount.automount: true
    asserts:
      - equal:
          path: automountServiceAccountToken
          value: true
        template: templates/serviceaccount.yaml
      - equal:
          path: spec.template.spec.automountServiceAccountToken
          value: true
        template: templates/deployment.yaml

  - it: removes the tmp volume when tmpVolume.enabled is false
    set:
      tmpVolume.enabled: false
    asserts:
      - notExists:
          path: spec.template.spec.volumes
        template: templates/deployment.yaml
      - notExists:
          path: spec.template.spec.containers[0].volumeMounts
        template: templates/deployment.yaml

  - it: does not render the ServiceAccount when create is false
    set:
      serviceAccount.create: false
    asserts:
      - hasDocuments:
          count: 0
        template: templates/serviceaccount.yaml
      - equal:
          path: spec.template.spec.serviceAccountName
          value: default
        template: templates/deployment.yaml

  - it: uses an explicit ServiceAccount name
    set:
      serviceAccount.name: app-identity
    asserts:
      - equal:
          path: metadata.name
          value: app-identity
        template: templates/serviceaccount.yaml
      - equal:
          path: spec.template.spec.serviceAccountName
          value: app-identity
        template: templates/deployment.yaml
