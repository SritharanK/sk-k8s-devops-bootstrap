suite: Secret mounts
templates:
  - templates/deployment.yaml
release:
  name: web
  namespace: dev
tests:
  - it: mounts an existing Secret read-only
    set:
      secretMounts:
        db:
          secretName: app-db
          mountPath: /var/run/secrets/db
    asserts:
      - contains:
          path: spec.template.spec.volumes
          content:
            name: secret-db
            secret:
              secretName: app-db
      - contains:
          path: spec.template.spec.containers[0].volumeMounts
          content:
            name: secret-db
            mountPath: /var/run/secrets/db
            readOnly: true

  - it: passes items and optional through
    set:
      secretMounts:
        db:
          secretName: app-db
          mountPath: /var/run/secrets/db
          items:
            - key: password
              path: password
          optional: false
    asserts:
      - contains:
          path: spec.template.spec.volumes
          content:
            name: secret-db
            secret:
              secretName: app-db
              items:
                - key: password
                  path: password
              optional: false

  - it: requires secretName
    set:
      secretMounts:
        db:
          mountPath: /var/run/secrets/db
    asserts:
      - failedTemplate:
          errorPattern: "secretMounts.db.secretName is required"

  - it: requires mountPath
    set:
      secretMounts:
        db:
          secretName: app-db
    asserts:
      - failedTemplate:
          errorPattern: "secretMounts.db.mountPath is required"

  - it: appends extra volumes and mounts after the chart volumes
    set:
      extraVolumes:
        - name: cache
          emptyDir: {}
      extraVolumeMounts:
        - name: cache
          mountPath: /var/cache/app
    asserts:
      - equal:
          path: spec.template.spec.volumes
          value:
            - name: tmp
              emptyDir:
                sizeLimit: 64Mi
            - name: cache
              emptyDir: {}
      - equal:
          path: spec.template.spec.containers[0].volumeMounts
          value:
            - name: tmp
              mountPath: /tmp
            - name: cache
              mountPath: /var/cache/app
