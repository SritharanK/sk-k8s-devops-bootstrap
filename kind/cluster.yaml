# kind cluster for the lab profile: `make demo` and the e2e suite.
#
# - One control plane and two workers, so scheduling, PodDisruptionBudgets and
#   cross-node NetworkPolicy behave as on a real cluster.
# - The default CNI (kindnet) is disabled. hack/demo/up.sh installs Calico, which
#   enforces NetworkPolicy, before anything else is scheduled.
# - Host ports 80 and 443 on 127.0.0.1 map to the fixed NodePorts of the Envoy
#   proxy Service of Gateway `platform` (30080 for listener http, 30443 for
#   listener https). The Service uses externalTrafficPolicy Cluster, so the
#   control-plane node forwards to Envoy pods on the workers. *.localtest.me
#   resolves to 127.0.0.1, which makes https://<app>.<env>.localtest.me work
#   from the host.
# - The node image is pinned by digest. hack/demo/up.sh replaces it with the
#   image in kind/node-images.yaml that matches cluster.kubernetesMinor in
#   clusters/lab/cluster.yaml, and replaces the host ports when DEMO_HTTP_PORT or
#   DEMO_HTTPS_PORT is set.
kind: Cluster
apiVersion: kind.x-k8s.io/v1alpha4
name: demo
networking:
  disableDefaultCNI: true
  podSubnet: 10.244.0.0/16
  serviceSubnet: 10.96.0.0/16
nodes:
  - role: control-plane
    image: kindest/node:v1.36.4@sha256:099e049362a1526b2db71494e1947aae99bd16290d7c895f2b7ea312e3cbfaed
    extraPortMappings:
      - containerPort: 30080
        hostPort: 80
        listenAddress: 127.0.0.1
        protocol: TCP
      - containerPort: 30443
        hostPort: 443
        listenAddress: 127.0.0.1
        protocol: TCP
  - role: worker
    image: kindest/node:v1.36.4@sha256:099e049362a1526b2db71494e1947aae99bd16290d7c895f2b7ea312e3cbfaed
  - role: worker
    image: kindest/node:v1.36.4@sha256:099e049362a1526b2db71494e1947aae99bd16290d7c895f2b7ea312e3cbfaed
