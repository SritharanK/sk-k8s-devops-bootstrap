# -----------------------------------------------------------------------------
# Argo CD bootstrap - Helm values
# -----------------------------------------------------------------------------
# This chart is used to render the root Application(s) that Argo CD syncs.
# Replace CHANGE_ME with your Git repo URL (this repo or your fork). The same
# URL is used by scripts/misc/argocd_prerequisite.sh when creating the
# argocd-bootstraper Application.
#
# destination.app_ns: namespace where application workloads are deployed (e.g. prod).
# destination.argo_ns: namespace where Argo CD is installed (argocd).
# -----------------------------------------------------------------------------

spec:
  project: default
  destination:
    server: https://kubernetes.default.svc
    app_ns: prod
    argo_ns: argocd
  source:
    repoURL: CHANGE_ME  # git_repo_url from config/defaults.yaml
    targetRevision: main  # git_branch from config/defaults.yaml
    helm:
      valueFiles:
        - values-prod.yaml

# ── Platform-level values ─────────────────────────────────────────────────────
# Passed as Helm parameters to toolchain charts (00_misc, network-policies,
# kyverno-policies). Match these with your config/defaults.yaml values.
platform:
  certManagerEmail: "CHANGE_ME"           # cert_manager_email from config/defaults.yaml
  adminGroup: "YOUR_PLATFORM_ADMIN_GROUP" # platform_admin_group from config/defaults.yaml
  deployersGroup: "deployers"             # platform_deployers_group from config/defaults.yaml
  clusterCidr: "10.42.0.0/16"            # cluster_cidr from config/defaults.yaml

namespaces:
  prod: "prod"
  dev: "dev"
  stage: "stage"
  argocd: "argocd"
  nginx: "nginx"
  certManager: "cert-manager"
  kyverno: "kyverno"

# ── ApplicationSet — scale-mode deployment ────────────────────────────────────
# An alternative to the static Application manifests in templates/applications/.
# Set enabled: true to activate the ApplicationSet generator, which creates one
# ArgoCD Application per entry in the apps[] list below.
#
# When to prefer ApplicationSet over static Applications:
#   - You manage 10+ microservices and want one object to rule them
#   - You want to onboard new apps by adding a list entry (no new YAML file)
#   - You want Git-driven app inventory with automatic pruning
#
# The static Applications (templates/applications/*.yaml) and this ApplicationSet
# are independent and can coexist, but to avoid duplicate Applications you should
# enable only one mode at a time in production.
applicationSet:
  enabled: false   # set to true to activate scale-mode deployment
  # apps: one entry per (service × environment) combination.
  # appName  — unique ArgoCD Application name (must be unique across all entries)
  # name     — chart directory under helmcharts/app-charts/
  # namespace — target Kubernetes namespace
  # valuesFile — Helm values file to use (relative to chart root)
  apps:
    # ── Production ───────────────────────────────────────────────────────────
    - appName: java-springboot
      name: java-springboot
      namespace: prod
      valuesFile: values-prod.yaml
    - appName: laravel-example
      name: laravel-example
      namespace: prod
      valuesFile: values-prod.yaml
    - appName: payments-example
      name: payments-example
      namespace: prod
      valuesFile: values-prod.yaml
    - appName: python-django
      name: python-django
      namespace: prod
      valuesFile: values-prod.yaml
    - appName: surge-plugin
      name: surge-plugin
      namespace: prod
      valuesFile: values-prod.yaml
    # ── Staging ──────────────────────────────────────────────────────────────
    - appName: java-springboot-stage
      name: java-springboot
      namespace: stage
      valuesFile: values-stage.yaml
    - appName: laravel-example-stage
      name: laravel-example
      namespace: stage
      valuesFile: values-stage.yaml
    - appName: payments-example-stage
      name: payments-example
      namespace: stage
      valuesFile: values-stage.yaml
    - appName: python-django-stage
      name: python-django
      namespace: stage
      valuesFile: values-stage.yaml
    - appName: surge-plugin-stage
      name: surge-plugin
      namespace: stage
      valuesFile: values-stage.yaml
    # ── Development ──────────────────────────────────────────────────────────
    - appName: java-springboot-dev
      name: java-springboot
      namespace: dev
      valuesFile: values-dev.yaml
    - appName: laravel-example-dev
      name: laravel-example
      namespace: dev
      valuesFile: values-dev.yaml
    - appName: payments-example-dev
      name: payments-example
      namespace: dev
      valuesFile: values-dev.yaml
    - appName: python-django-dev
      name: python-django
      namespace: dev
      valuesFile: values-dev.yaml
    - appName: surge-plugin-dev
      name: surge-plugin
      namespace: dev
      valuesFile: values-dev.yaml

# ── Policy engines ─────────────────────────────────────────────────────────────
# Set enabled: false to skip the engine install (e.g. Kyverno already installed
# out-of-band, or you prefer a different policy engine).
policies:
  kyverno:
    enabled: true
    namespace: "kyverno"   # must match namespaces.kyverno above
