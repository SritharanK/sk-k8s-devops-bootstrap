{{- if .Values.toolchains.misc.enabled }}
apiVersion: argoproj.io/v1alpha1
kind: Application
metadata:
  name: misc
  namespace: argocd
  annotations:
    argocd.argoproj.io/manifest-generate-paths: ./helmcharts/system-charts/00_misc
    argocd.argoproj.io/sync-wave: "3"
  finalizers:
    - resources-finalizer.argocd.argoproj.io
spec:
  project: prod
  destination:
    server: {{ .Values.spec.destination.server }}
    # namespace: cert-manager
  source:
    repoURL: {{ .Values.spec.source.repoURL }}
    targetRevision: {{ .Values.spec.source.targetRevision }}
    path: ./helmcharts/system-charts/00_misc
    helm:
      parameters:
        - name: certManager.email
          value: {{ .Values.platform.certManagerEmail | quote }}
        - name: rbac.platformAdminGroup
          value: {{ .Values.platform.adminGroup | quote }}
        - name: rbac.deployersGroup
          value: {{ .Values.platform.deployersGroup | quote }}
        - name: namespaces.prod
          value: {{ .Values.namespaces.prod | quote }}
        - name: namespaces.dev
          value: {{ .Values.namespaces.dev | quote }}
        - name: namespaces.stage
          value: {{ .Values.namespaces.stage | quote }}
  syncPolicy:
    automated:
      prune: true
      selfHeal: true
    syncOptions:
      - ApplyOutOfSyncOnly=true
      - PruneLast=true
      - CreateNamespace=true
      - Validate=false
    retry:
      limit: 5
      backoff:
        duration: 10s
        factor: 2
        maxDuration: 5m
{{- end }}
