{{- if .Values.policies.kyverno.enabled }}
# Wave 6: Kyverno ClusterPolicies are applied only after the engine (wave 4)
# has registered its CRDs and is ready to serve admission webhooks.
apiVersion: argoproj.io/v1alpha1
kind: Application
metadata:
  name: kyverno-policies
  namespace: argocd
  annotations:
    argocd.argoproj.io/manifest-generate-paths: ./helmcharts/system-charts/kyverno-policies
    argocd.argoproj.io/sync-wave: "6"
  finalizers:
    - resources-finalizer.argocd.argoproj.io
spec:
  project: {{ .Values.spec.project }}
  destination:
    server: {{ .Values.spec.destination.server }}
    namespace: ""
  source:
    repoURL: {{ .Values.spec.source.repoURL }}
    targetRevision: {{ .Values.spec.source.targetRevision }}
    path: ./helmcharts/system-charts/kyverno-policies
    helm:
      parameters:
        - name: enforcedNamespaces[0]
          value: {{ .Values.namespaces.prod | quote }}
        - name: enforcedNamespaces[1]
          value: {{ .Values.namespaces.dev | quote }}
        - name: enforcedNamespaces[2]
          value: {{ .Values.namespaces.stage | quote }}
  syncPolicy:
    automated:
      prune: true
      selfHeal: true
    syncOptions:
      - ApplyOutOfSyncOnly=true
      - PruneLast=true
      - CreateNamespace=false
      - Validate=false
    retry:
      limit: 5
      backoff:
        duration: 10s
        factor: 2
        maxDuration: 5m
{{- end }}
