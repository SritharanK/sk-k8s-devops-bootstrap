{{- /*
  keda: KEDA event-driven autoscaling (optional).
  Optional operations component, off unless toolchains.keda.enabled is true in
  clusters/<cluster>/cluster.yaml. toolchains.keda.values is passed as helm.valuesObject.
  Sync wave 4 per the toolchain convention.
*/}}
{{- if (dig "keda" "enabled" false .Values.toolchains) }}
{{- $values := dig "keda" "values" (dict) .Values.toolchains }}
apiVersion: argoproj.io/v1alpha1
kind: Application
metadata:
  name: {{ include "argocd-bootstrap.name" (list . "keda") }}
  namespace: {{ .Values.namespaces.argocd }}
  annotations:
    argocd.argoproj.io/sync-wave: "4"
    argocd.argoproj.io/manifest-generate-paths: "."
  finalizers:
    - resources-finalizer.argocd.argoproj.io
spec:
  project: {{ include "argocd-bootstrap.platformProject" . }}
  source:
    repoURL: {{ .Values.git.repoURL }}
    targetRevision: {{ .Values.git.targetRevision }}
    path: helmcharts/system-charts/keda
    helm:
      releaseName: keda
      valueFiles:
        - values.yaml
        - values-{{ .Values.cluster.profile }}.yaml
      ignoreMissingValueFiles: true
      {{- with $values }}
      valuesObject:
        {{- toYaml . | nindent 8 }}
      {{- end }}
  destination:
    {{- include "argocd-bootstrap.destination" . | nindent 4 }}
    namespace: {{ dig "keda" "keda" .Values.namespaces }}
  # The operator writes caBundle on its webhook configurations at runtime.
  ignoreDifferences:
    - group: admissionregistration.k8s.io
      kind: MutatingWebhookConfiguration
      jqPathExpressions:
        - .webhooks[]?.clientConfig.caBundle
    - group: admissionregistration.k8s.io
      kind: ValidatingWebhookConfiguration
      jqPathExpressions:
        - .webhooks[]?.clientConfig.caBundle
    - group: apiregistration.k8s.io
      kind: APIService
      jsonPointers:
        - /spec/caBundle
  syncPolicy:
    automated:
      prune: true
      selfHeal: true
    syncOptions:
      - CreateNamespace=true
      - ServerSideApply=true
      - RespectIgnoreDifferences=true
      # ServiceMonitors and other CRs whose CRDs come from another Application.
      - SkipDryRunOnMissingResource=true
    managedNamespaceMetadata:
      labels:
        pod-security.kubernetes.io/enforce: restricted
        pod-security.kubernetes.io/enforce-version: v{{ .Values.cluster.kubernetesMinor }}
        pod-security.kubernetes.io/audit: restricted
        pod-security.kubernetes.io/audit-version: v{{ .Values.cluster.kubernetesMinor }}
    retry:
      limit: 10
      backoff:
        duration: 10s
        factor: 2
        maxDuration: 5m
{{- end }}
