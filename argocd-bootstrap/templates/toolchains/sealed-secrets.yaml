{{- /*
Sealed Secrets controller (wave 0, lab profile). Installed as
sealed-secrets-controller in kube-system so kubeseal defaults work. The CRD
ships in the chart crds/ directory without a keep annotation, so the whole
Application is Delete=false: removing it leaves the CRD, every SealedSecret
and the Secrets generated from them in place.
*/ -}}
{{- $name := "sealed-secrets" }}
{{- if (dig "sealed-secrets" "enabled" false .Values.toolchains) }}
apiVersion: argoproj.io/v1alpha1
kind: Application
metadata:
  name: {{ include "argocd-bootstrap.name" (list . $name) }}
  namespace: {{ .Values.namespaces.argocd }}
  annotations:
    argocd.argoproj.io/sync-wave: "0"
    argocd.argoproj.io/manifest-generate-paths: "."
  finalizers: [resources-finalizer.argocd.argoproj.io]
spec:
  project: {{ include "argocd-bootstrap.platformProject" . }}
  source:
    repoURL: {{ .Values.git.repoURL }}
    targetRevision: {{ .Values.git.targetRevision }}
    path: helmcharts/system-charts/{{ $name }}
    helm:
      releaseName: {{ $name }}
      valueFiles: [values.yaml, values-{{ .Values.cluster.profile }}.yaml]
      ignoreMissingValueFiles: true
      {{- with (dig $name "values" dict .Values.toolchains) }}
      valuesObject:
        {{- toYaml . | nindent 8 }}
      {{- end }}
  destination:
    {{- include "argocd-bootstrap.destination" . | nindent 4 }}
    # kube-system exists; no CreateNamespace and no managed labels on it.
    namespace: kube-system
  syncPolicy:
    automated: {prune: true, selfHeal: true}
    syncOptions: [ServerSideApply=true, Delete=false]
    retry:
      limit: 10
      backoff:
        duration: 10s
        factor: 2
        maxDuration: 5m
{{- end }}
