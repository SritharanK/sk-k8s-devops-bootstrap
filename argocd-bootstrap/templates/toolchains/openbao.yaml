{{- /*
OpenBao HA with Raft and the External Secrets ClusterSecretStore (wave 4,
reference profile). OpenBao needs a one-time initialisation and unseal (or
auto-unseal); until then this wave stays Progressing and holds back the
application wave only, never the core platform waves.
*/ -}}
{{- $name := "openbao" }}
{{- if (dig "openbao" "enabled" false .Values.toolchains) }}
apiVersion: argoproj.io/v1alpha1
kind: Application
metadata:
  name: {{ include "argocd-bootstrap.name" (list . $name) }}
  namespace: {{ .Values.namespaces.argocd }}
  annotations:
    argocd.argoproj.io/sync-wave: "4"
    argocd.argoproj.io/manifest-generate-paths: "."
  finalizers: [resources-finalizer.argocd.argoproj.io]
spec:
  project: {{ include "argocd-bootstrap.platformProject" . }}
  source:
    repoURL: {{ .Values.git.repoURL }}
    targetRevision: {{ .Values.git.targetRevision }}
    path: helmcharts/system-charts/{{ $name }}
    helm:
      releaseName: {{ $name }}
      valueFiles: [values.yaml, values-{{ .Values.cluster.profile }}.yaml]
      ignoreMissingValueFiles: true
      {{- with (dig $name "values" dict .Values.toolchains) }}
      valuesObject:
        {{- toYaml . | nindent 8 }}
      {{- end }}
  destination:
    {{- include "argocd-bootstrap.destination" . | nindent 4 }}
    namespace: {{ dig "openbao" "openbao" .Values.namespaces }}
  syncPolicy:
    automated: {prune: true, selfHeal: true}
    syncOptions: [CreateNamespace=true, ServerSideApply=true]
    managedNamespaceMetadata:
      labels:
        pod-security.kubernetes.io/enforce: restricted
        pod-security.kubernetes.io/enforce-version: v{{ .Values.cluster.kubernetesMinor }}
        pod-security.kubernetes.io/audit: restricted
        pod-security.kubernetes.io/warn: restricted
    retry:
      limit: 10
      backoff:
        duration: 10s
        factor: 2
        maxDuration: 5m
{{- end }}
