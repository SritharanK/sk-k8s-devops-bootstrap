{{- /*
  slo: SLO recording and burn-rate alert rules generated with Sloth.
  Requires the monitoring toolchain (PrometheusRule CRD and the rule selector).
  Optional operations component, off unless toolchains.slo.enabled is true in
  clusters/<cluster>/cluster.yaml. toolchains.slo.values is passed as helm.valuesObject.
  Sync wave 4 per the toolchain convention.
*/}}
{{- if (dig "slo" "enabled" false .Values.toolchains) }}
{{- $values := dig "slo" "values" (dict) .Values.toolchains }}
apiVersion: argoproj.io/v1alpha1
kind: Application
metadata:
  name: {{ include "argocd-bootstrap.name" (list . "slo") }}
  namespace: {{ .Values.namespaces.argocd }}
  annotations:
    argocd.argoproj.io/sync-wave: "4"
    argocd.argoproj.io/manifest-generate-paths: "."
  finalizers:
    - resources-finalizer.argocd.argoproj.io
spec:
  project: {{ include "argocd-bootstrap.platformProject" . }}
  source:
    repoURL: {{ .Values.git.repoURL }}
    targetRevision: {{ .Values.git.targetRevision }}
    path: helmcharts/system-charts/slo
    helm:
      releaseName: slo
      valueFiles:
        - values.yaml
        - values-{{ .Values.cluster.profile }}.yaml
      ignoreMissingValueFiles: true
      {{- with $values }}
      valuesObject:
        {{- toYaml . | nindent 8 }}
      {{- end }}
  destination:
    {{- include "argocd-bootstrap.destination" . | nindent 4 }}
    namespace: {{ dig "monitoring" "monitoring" .Values.namespaces }}
  syncPolicy:
    automated:
      prune: true
      selfHeal: true
    # The monitoring Application creates and labels the namespace; this one only adds rules.
    syncOptions:
      - ServerSideApply=true
      # PrometheusRule CRD comes from the monitoring Application.
      - SkipDryRunOnMissingResource=true
    retry:
      limit: 10
      backoff:
        duration: 10s
        factor: 2
        maxDuration: 5m
{{- end }}
