apiVersion: argoproj.io/v1alpha1
kind: Application
metadata:
  name: network-policies
  namespace: argocd
  annotations:
    argocd.argoproj.io/manifest-generate-paths: ./helmcharts/system-charts/network-policies
    argocd.argoproj.io/sync-wave: "5"
  finalizers:
    - resources-finalizer.argocd.argoproj.io
spec:
  project: default
  destination:
    server: {{ .Values.spec.destination.server }}
    namespace: prod
  source:
    repoURL: {{ .Values.spec.source.repoURL }}
    targetRevision: {{ .Values.spec.source.targetRevision }}
    path: ./helmcharts/system-charts/network-policies
    helm:
      parameters:
        - name: appNamespaces[0]
          value: {{ .Values.namespaces.prod | quote }}
        - name: appNamespaces[1]
          value: {{ .Values.namespaces.dev | quote }}
        - name: appNamespaces[2]
          value: {{ .Values.namespaces.stage | quote }}
        - name: ingressNginxNamespace
          value: {{ .Values.namespaces.nginx | quote }}
  syncPolicy:
    automated:
      prune: true
      selfHeal: true
    syncOptions:
      - ApplyOutOfSyncOnly=true
      - PruneLast=true
      - CreateNamespace=true
      - Validate=false
    retry:
      limit: 5
      backoff:
        duration: 10s
        factor: 2
        maxDuration: 5m
