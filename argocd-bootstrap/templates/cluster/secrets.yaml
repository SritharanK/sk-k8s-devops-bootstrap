{{- /*
SealedSecrets of this cluster, lab profile only (see
docs/adr/0006-sealed-secrets-and-eso-with-openbao.md). Sealed secrets are bound
to one controller key, so they live under clusters/<name>/secrets/<namespace>/
and are written by hack/seal.sh. Wave 1: after the sealed-secrets controller
(wave 0). No resources finalizer: deleting this Application leaves the
secrets, and the Secrets generated from them, in place.
*/ -}}
{{- if (dig "cluster-secrets" "enabled" false .Values.toolchains) }}
{{- $path := printf "clusters/%s/secrets" .Values.cluster.name }}
apiVersion: argoproj.io/v1alpha1
kind: Application
metadata:
  name: {{ include "argocd-bootstrap.name" (list . "cluster-secrets") }}
  namespace: {{ .Values.namespaces.argocd }}
  labels:
    {{- include "argocd-bootstrap.labels" . | nindent 4 }}
  annotations:
    argocd.argoproj.io/sync-wave: "1"
    argocd.argoproj.io/manifest-generate-paths: {{ printf "/%s" $path | quote }}
spec:
  project: {{ include "argocd-bootstrap.platformProject" . }}
  source:
    repoURL: {{ .Values.git.repoURL }}
    targetRevision: {{ .Values.git.targetRevision | quote }}
    path: {{ $path }}
    directory:
      recurse: true
      include: "*.yaml"
  destination:
    {{- include "argocd-bootstrap.destination" . | nindent 4 }}
    namespace: {{ .Values.namespaces.argocd }}
  syncPolicy:
    automated:
      prune: true
      selfHeal: true
    syncOptions:
      - CreateNamespace=false
      - SkipDryRunOnMissingResource=true
    retry:
      limit: 10
      backoff:
        duration: 10s
        factor: 2
        maxDuration: 5m
  revisionHistoryLimit: 10
{{- end }}
