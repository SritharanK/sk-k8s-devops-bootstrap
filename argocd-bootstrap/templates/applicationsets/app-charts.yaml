{{- if .Values.applicationSet.enabled }}
# ApplicationSet — scale-mode alternative to the static Application manifests
# in templates/applications/*.yaml.
#
# Use this when you manage many apps and want a single ArgoCD object to generate
# and lifecycle all Application resources automatically. To switch from static
# mode to ApplicationSet mode:
#   1. Set applicationSet.enabled: true in argocd-bootstrap/values.yaml
#   2. Remove or ignore templates/applications/ to avoid duplicate Applications
#   3. Extend applicationSet.apps[] to onboard new services — no new YAML file needed
#
# Each entry requires: name (chart dir), appName (unique ArgoCD app name),
# namespace, and valuesFile. This pattern supports all three environments
# (dev/stage/prod) from a single ApplicationSet object.
#
# Sync-wave 10 matches the static Applications so both modes are equivalent.
apiVersion: argoproj.io/v1alpha1
kind: ApplicationSet
metadata:
  name: app-charts
  namespace: argocd
  annotations:
    argocd.argoproj.io/sync-wave: "10"
spec:
  # Generate one Application per entry in .Values.applicationSet.apps
  generators:
    - list:
        elements:
          {{- range .Values.applicationSet.apps }}
          - appName: {{ .appName }}
            chartName: {{ .name }}
            namespace: {{ .namespace }}
            valuesFile: {{ .valuesFile }}
          {{- end }}

  template:
    metadata:
      name: "{{`{{appName}}`}}"
      namespace: argocd
      finalizers:
        - resources-finalizer.argocd.argoproj.io
    spec:
      project: {{ .Values.spec.project }}
      destination:
        server: {{ .Values.spec.destination.server }}
        namespace: "{{`{{namespace}}`}}"
      source:
        repoURL: {{ .Values.spec.source.repoURL }}
        targetRevision: {{ .Values.spec.source.targetRevision }}
        path: "./helmcharts/app-charts/{{`{{chartName}}`}}"
        helm:
          valueFiles:
            - "{{`{{valuesFile}}`}}"
      syncPolicy:
        automated:
          prune: true
          selfHeal: true
        syncOptions:
          - ApplyOutOfSyncOnly=true
          - PruneLast=true
          - CreateNamespace=false
          - Validate=false
        retry:
          limit: 5
          backoff:
            duration: 10s
            factor: 2
            maxDuration: 5m
{{- end }}
