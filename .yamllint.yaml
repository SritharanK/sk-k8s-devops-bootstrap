# yamllint configuration.
#
# Run:  make lint-yaml   (yamllint -s -c .yamllint.yaml .)
# Docs: https://yamllint.readthedocs.io/en/stable/configuration.html
#
# Starts from the upstream default rule set and only relaxes rules that fight
# idiomatic Kubernetes, Helm, Ansible and GitHub Actions YAML. CI and the
# pre-commit hook run in strict mode (-s), so warnings fail the build as well.

extends: default

# The default set plus extension-less YAML files that this repository uses.
yaml-files:
  - "*.yaml"
  - "*.yml"
  - ".yamllint"
  - ".ansible-lint"

# Paths that are not plain YAML or not maintained in this repository.
# Patterns use .gitignore syntax and also apply to files passed explicitly
# (pre-commit), so a hook never reports on an ignored path.
ignore: |
  # Helm templates are Go templates that only become YAML after rendering;
  # the rendered output is validated by `make kubeconform` instead.
  **/templates/**
  # Chart dependency archives fetched by `helm dependency build`.
  **/charts/**
  # Chart.lock is written by Helm. It is not matched by yaml-files, so this
  # entry only keeps explicit invocations quiet.
  **/Chart.lock
  # Generated renders (gitignored).
  _out/
  # Third-party files kept byte for byte (see the README next to each): an
  # upstream chart without a Helm repository and upstream release manifests.
  # Fixing their style would break the checksum against the upstream source.
  helmcharts/**/vendor/
  helmcharts/**/upstream/
  # Prometheus rules generated by Sloth from slos/ (generate.sh --check in CI).
  helmcharts/system-charts/slo/rules/
  # Collections installed at run time by ansible-galaxy.
  ansible/collections/ansible_collections/
  # Hidden directories at any depth hold editor, tool and cache state
  # (.venv, .cache, extra worktrees). .github/ is the only hidden directory
  # with YAML that belongs to the repository.
  .*/
  !/.github/
  node_modules/

rules:
  # Kubernetes manifests and values files mostly start without `---`, while
  # multi-document files keep their separators. Neither form is enforced.
  document-start: disable

  # Kept as a readability check, not a correctness check. Image references
  # with digests, URLs and CEL or JMESPath expressions in Kyverno policies
  # rarely fit in 80 columns, so the limit is 160 and a line that is a single
  # unbreakable word (a URL) is always accepted. Data that cannot be wrapped
  # at all, such as SSH known_hosts entries or PEM blocks, carries a scoped
  # `# yamllint disable rule:line-length` / `# yamllint enable` pair placed
  # around the key (comments inside a block scalar are content, not comments).
  line-length:
    level: warning
    max: 160
    allow-non-breakable-words: true
    allow-non-breakable-inline-mappings: true

  # Only true and false are booleans. yes/no/on/off are booleans in YAML 1.1
  # (Ansible, PyYAML) but strings in YAML 1.2 (Go parsers, Helm, kubectl), so
  # they are an error. check-keys is off because GitHub Actions uses `on:` as
  # a top-level key.
  truthy:
    level: error
    allowed-values: ["true", "false"]
    check-keys: false

  # One space before an inline comment matches upstream Helm values files.
  comments:
    min-spaces-from-content: 1

  # Two-space indentation. Block sequences may or may not be indented under
  # their parent key: kubectl output, Helm charts and Ansible use both styles,
  # and normalising them creates diff noise without functional value.
  indentation:
    spaces: 2
    indent-sequences: whatever
    check-multi-line-strings: false

  # Inline flow maps and lists ({enabled: false}, [dev, stage]) are allowed
  # in values and cluster files. At most one space inside is tolerated so
  # snippets copied from upstream charts pass; empty ones are {} and [].
  braces:
    forbid: false
    min-spaces-inside: 0
    max-spaces-inside: 1
    min-spaces-inside-empty: 0
    max-spaces-inside-empty: 0
  brackets:
    forbid: false
    min-spaces-inside: 0
    max-spaces-inside: 1
    min-spaces-inside-empty: 0
    max-spaces-inside-empty: 0

  # 0644 is octal in YAML 1.1 and decimal in YAML 1.2, and 0o644 is octal in
  # YAML 1.2 but a string in YAML 1.1. File modes and similar values are
  # quoted ("0644") so Ansible, Helm and kubectl read the same value.
  octal-values:
    forbid-implicit-octal: true
    forbid-explicit-octal: true
