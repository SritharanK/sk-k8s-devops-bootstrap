# Pinned toolchain for local development, the devcontainer and CI.
#
# Install:   mise trust && mise install
# Check:     make doctor
#
# CI installs the same versions with jdx/mise-action, so a local `make <target>`
# runs the same tool versions as the matching CI job.
#
# Supply chain:
#   - Every tool names its backend explicitly. aqua backends download release
#     assets and verify them against the published checksums, and against
#     cosign or SLSA attestations where the aqua registry defines them. The
#     asdf and vfox backends (plugin shell scripts) are disabled.
#   - Python tools install with uv into isolated environments on a pinned
#     CPython minor; npm tools run on the pinned Node.js.
#   - Renovate updates this file (mise manager) after a 7-day minimum release
#     age; see renovate.json.
#   - Trivy 0.76.2: the release checksums file was verified with cosign
#     against the aquasecurity/trivy release workflow identity. Releases
#     affected by GHSA-69fq-xp46-6x23 (Trivy 0.69.4) must never be pinned.

min_version = "2026.11.0"

[settings]
disable_backends = ["asdf", "vfox"]

[tools]
# Runtimes used by tool backends
"aqua:astral-sh/uv" = "0.13.7"
node = "26.13.0"
go = "1.27.4"

# Kubernetes and Helm
"aqua:helm/helm" = "4.3.1"
"aqua:kubernetes/kubernetes/kubectl" = "1.36.6"
"aqua:kubernetes-sigs/kind" = "0.33.0"
"aqua:yannh/kubeconform" = "0.8.0"
"aqua:norwoodj/helm-docs" = "1.14.2"
"aqua:kyverno/kyverno" = "1.20.0"
"aqua:kyverno/chainsaw" = "0.2.15"
"aqua:mikefarah/yq" = "4.54.3"

# Supply chain and security
"aqua:sigstore/cosign" = "3.1.4"
"aqua:gitleaks/gitleaks" = "8.30.1"
"aqua:aquasecurity/trivy" = "0.76.2"
"aqua:zizmorcore/zizmor" = "1.32.0"

# Linters
"aqua:koalaman/shellcheck" = "0.11.0"
"aqua:mvdan/sh" = "3.14.1"
"aqua:rhysd/actionlint" = "1.7.12"
"aqua:hadolint/hadolint" = "2.15.1"
"aqua:lycheeverse/lychee" = "0.24.2"
"npm:markdownlint-cli2" = "0.24.0"
"pypi:yamllint" = { version = "1.38.0", python = "3.13" }
"pypi:pre-commit" = { version = "4.7.0", python = "3.13" }
"pypi:check-jsonschema" = { version = "0.39.0", python = "3.13" }

# Ansible: versions equal ansible/requirements-dev.txt; Renovate updates both together.
"pypi:ansible-core" = { version = "2.21.6", python = "3.13" }
"pypi:ansible-lint" = { version = "26.11.0", python = "3.13", with = ["ansible-core==2.21.6"] }
"pypi:molecule" = { version = "26.11.0", python = "3.13", with = ["ansible-core==2.21.6", "molecule-plugins[docker]==26.11.0", "docker==7.2.0"] }

# Infrastructure as code
"aqua:opentofu/opentofu" = "1.13.9"
