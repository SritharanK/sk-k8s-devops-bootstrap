# Gitleaks configuration.
#
# Scans run in three places with this file:
#   - pre-commit: staged changes (`gitleaks git --pre-commit --staged`);
#   - `make secrets` and CI on every push and pull request: the working tree
#     (`gitleaks dir`) and the commits of the change (`gitleaks git`);
#   - CI weekly: the full Git history with the credential rules only
#     (.github/gitleaks-history.toml, which extends this file).
#
# Rules: the built-in default ruleset plus two repository rules that keep
# environment data out of configuration files:
#   - hardcoded-ipv4:   IPv4 literals other than loopback, unspecified,
#                       documentation ranges (RFC 5737) and private CIDRs;
#   - hardcoded-domain: host names whose domain is neither a placeholder nor
#                       a known upstream project or registry.
#
# Placeholders that pass: CHANGE_ME, YOUR_ORG, example.com, example.org,
# example.net, localtest.me, and the RFC 5737 networks 192.0.2.0/24,
# 198.51.100.0/24 and 203.0.113.0/24 for example addresses.
#
# Adding an upstream domain: append it to the hardcoded-domain allowlist in
# the same change that introduces it, with the component that needs it.
# Accepting a single finding: add its fingerprint to .gitleaksignore with a
# reason. Never widen an allowlist to silence a credential rule.

title = "sk-k8s-devops-bootstrap"

# [[rules.allowlists]] with condition and regexTarget need gitleaks v8.25.0
# or later.
minVersion = "v8.25.0"

[extend]
useDefault = true

# ---------------------------------------------------------------------------
# Allowlists on default credential rules
# ---------------------------------------------------------------------------
# Scoped allowlists are attached to the rule they relax, never declared as
# global [[allowlists]] with `paths`: in directory scans (`gitleaks dir`,
# v8.30.1) a global allowlist whose path matches skips the whole file before
# any rule runs and ignores condition = "AND". A global path allowlist for
# YAML or *.example files would therefore hide every secret in those files.
# Redefining a default rule by id keeps its regex and adds the allowlist.

[[rules]]
id = "private-key"

  [[rules.allowlists]]
  description = "Key skeletons in *.example templates whose body is a placeholder token"
  # Both criteria must match: an *.example path AND a key block whose body is
  # only a placeholder. A real key in an *.example file is still reported.
  # The optional "+" covers the patch prefix in `gitleaks git` scans.
  condition = "AND"
  paths = ['''\.example(\.[A-Za-z0-9]+)?$''']
  regexTarget = "match"
  regexes = [
    '''(?s)-----BEGIN[ A-Z0-9_-]*PRIVATE KEY-----\s*\+?\s*(<[A-Z0-9_]+>|CHANGE_ME|\.\.\.)\s*\+?\s*-----END''',
  ]

[[rules]]
id = "generic-api-key"

  [[rules.allowlists]]
  description = "SealedSecret ciphertexts (encrypted to the cluster controller key)"
  # A sealed value is base64 of a 2-byte length (0x0200 for 4096-bit RSA), the
  # RSA-encrypted session key and the AES-GCM payload, so it starts with Ag[A-D]
  # and is several hundred characters long. Only lines of that exact shape in
  # YAML files are skipped. The optional "+" covers the patch prefix in
  # `gitleaks git` scans.
  condition = "AND"
  paths = ['''(?i)\.ya?ml$''']
  regexTarget = "line"
  regexes = [
    '''^\+?\s*[A-Za-z0-9_.-]+:\s*["']?Ag[A-D][A-Za-z0-9+/]{600,}={0,2}["']?\s*$''',
  ]

  [[rules.allowlists]]
  description = "Hex digests on fingerprint, checksum and digest keys"
  # Pins of public artifacts, for example a package signing key fingerprint
  # or a release archive SHA-256, sit under keys that contain "key". Only a
  # match whose key ends in fingerprint, checksum, digest or a SHA name and
  # whose value is 40 to 128 hex characters is skipped.
  regexTarget = "match"
  regexes = [
    '''(?i)(fingerprint|checksum|digest|sha1|sha256|sha512)["']?\s*[:=]\s*["']?(sha256:)?[0-9a-f]{40,128}["']?$''',
  ]

  [[rules.allowlists]]
  description = "Jenkins plugin lock: <plugin-id>:<version> lines"
  # Plugin IDs such as asm-api with versions such as 9.11.1-226.vff833a_e4c58e
  # look like keyed tokens. Only a match that is exactly id:version in this
  # one file is skipped; any other content in it is still scanned. The match
  # is tested rather than the line, because gitleaks leaves the line empty
  # for a finding on the last line of a file (v8.30.1).
  condition = "AND"
  paths = ['''^ansible/roles/install_jenkins/files/plugins\.txt$''']
  regexTarget = "match"
  regexes = [
    '''^[a-z0-9][a-z0-9._-]*:[0-9][A-Za-z0-9._+-]*$''',
  ]

# ---------------------------------------------------------------------------
# Repository rules: environment data in configuration files
# ---------------------------------------------------------------------------

[[rules]]
id = "hardcoded-ipv4"
description = "IPv4 address in a configuration file; use an RFC 5737 example address or a placeholder"
# Whole address with an optional prefix length. The surrounding character
# classes stand in for word boundaries (RE2 has no look-around), so version
# strings such as v1.2.3.4 and OIDs such as 1.3.6.1.4.1 do not match.
regex = '''(?m)(?:^|[^0-9A-Za-z._-])((?:25[0-5]|2[0-4][0-9]|1[0-9]{2}|[1-9]?[0-9])(?:\.(?:25[0-5]|2[0-4][0-9]|1[0-9]{2}|[1-9]?[0-9])){3}(?:/(?:3[0-2]|[12]?[0-9]))?)(?:$|[^0-9A-Za-z._-]|\.(?:$|[^0-9]))'''
secretGroup = 1
path = '''(?i)(\.(ya?ml|json|ini|toml|tfvars|tf|tpl|j2|cfg|conf|env|properties|sh|groovy)(\.example)?|(^|/)(hosts|Jenkinsfile[^/]*|Dockerfile[^/]*)(\.example)?)$'''
tags = ["environment-data"]

  [[rules.allowlists]]
  description = "Loopback, unspecified, netmasks, documentation networks and the metadata endpoint"
  regexes = [
    '''^0\.0\.0\.0(/0)?$''',
    '''^127\.''',
    '''^255\.''',
    '''^(192\.0\.2|198\.51\.100|203\.0\.113)\.[0-9]+(/[0-9]+)?$''',
    '''^169\.254\.169\.254(/32)?$''',
  ]

  [[rules.allowlists]]
  description = "Private, shared and link-local ranges in CIDR notation (pod, service and policy ranges)"
  regexes = [
    '''^10\.[0-9]+\.[0-9]+\.[0-9]+/[0-9]+$''',
    '''^172\.(1[6-9]|2[0-9]|3[01])\.[0-9]+\.[0-9]+/[0-9]+$''',
    '''^192\.168\.[0-9]+\.[0-9]+/[0-9]+$''',
    '''^100\.(6[4-9]|[7-9][0-9]|1[01][0-9]|12[0-7])\.[0-9]+\.[0-9]+/[0-9]+$''',
    '''^169\.254\.[0-9]+\.[0-9]+/[0-9]+$''',
  ]

  [[rules.allowlists]]
  description = "Four-part version numbers on version and tag keys, and RKE2 release notation"
  regexTarget = "line"
  regexes = [
    '''(?i)\b(tag|version|appVersion)["']?\s*[:=]''',
    '''v[0-9]+\.[0-9]+\.[0-9]+\+rke2r[0-9]+''',
  ]

  [[rules.allowlists]]
  description = "Private host addresses in example files (templates for gitignored real files)"
  condition = "AND"
  paths = ['''\.example$''']
  regexes = [
    '''^10\.[0-9]+\.[0-9]+\.[0-9]+$''',
    '''^172\.(1[6-9]|2[0-9]|3[01])\.[0-9]+\.[0-9]+$''',
    '''^192\.168\.[0-9]+\.[0-9]+$''',
  ]

  [[rules.allowlists]]
  description = "Negative fixtures of the gitleaks self-test"
  paths = ['''(^|/)hack/secrets-test\.sh$''']

[[rules]]
id = "hardcoded-domain"
description = "Host name outside the placeholder and upstream allowlist in a configuration file; use example.com or localtest.me"
# Matches dotted host names with a common public suffix. Helm template paths
# such as .Values.global.domain do not match because a name must not follow
# a dot or a dollar sign. The suffixes .dev and .app are left out because
# they collide with environment and key names (namespaces.dev).
regex = '''(?im)(?:^|[^a-z0-9_.$-])((?:\*\.)?(?:[a-z0-9](?:[a-z0-9-]{0,61}[a-z0-9])?\.)+(?:com|net|org|io|co|cloud|tech|ai|me|info|biz|eu|be|nl|de|fr|uk|us|ca|au|ch|at|se|dk|fi|es|it|pl|cz|pt|ie|lu|sg|jp|cn|ru|br|xyz|online|site|gov|edu))(?:$|[^a-z0-9_.-]|\.(?:$|[^a-z0-9]))'''
secretGroup = 1
path = '''(?i)(\.(ya?ml|json|ini|toml|tfvars|tf|tpl|j2|cfg|conf|env|properties)(\.example)?|(^|/)hosts(\.example)?)$'''
tags = ["environment-data"]

  [[rules.allowlists]]
  description = "Placeholder and reserved domains"
  regexes = [
    '''(?i)(^|\.)example\.(com|net|org)$''',
    '''(?i)(^|\.)localtest\.me$''',
  ]

  [[rules.allowlists]]
  description = "Upstream projects, registries, Kubernetes API groups and package sources"
  regexes = [
    # Source hosting, registries and release downloads
    '''(?i)(^|\.)(github\.com|githubusercontent\.com|github\.io|ghcr\.io|docker\.io|docker\.com|quay\.io|gcr\.io|microsoft\.com|googleapis\.com|amazonaws\.com|azure\.net)$''',
    # Kubernetes, Helm and CNCF projects (also API groups, labels and annotations)
    '''(?i)(^|\.)(kubernetes\.io|k8s\.io|x-k8s\.io|kubebuilder\.io|artifacthub\.io|cncf\.io|containerd\.io|opencontainers\.org|argoproj\.io|cert-manager\.io|jetstack\.io|letsencrypt\.org|kyverno\.io|bitnami\.com|envoyproxy\.io|external-secrets\.io|openbao\.org|coreos\.com|prometheus\.io|grafana\.com|opentelemetry\.io|jaegertracing\.io|velero\.io|min\.io|cnpg\.io|longhorn\.io|cattle\.io|rancher\.io|rancher\.com|rke2\.io|kube-vip\.io|cilium\.io|projectcalico\.org|tigera\.io|opencost\.io|falco\.org|falcosecurity\.org|cloudnative-pg\.io|openreports\.io|wgpolicyk8s\.io)$''',
    # Promotion (Kargo API group kargo.akuity.io, docs.kargo.io) and the
    # Backstage catalog (annotations and descriptor API group backstage.io)
    '''(?i)(^|\.)(akuity\.io|kargo\.io|backstage\.io)$''',
    # Supply chain and security tooling
    '''(?i)(^|\.)(in-toto\.io|spdx\.org|cyclonedx\.org|openssf\.org|aquasec\.com)$''',
    # Operating system, language and tool package sources
    '''(?i)(^|\.)(ubuntu\.com|debian\.org|rockylinux\.org|fedoraproject\.org|ntp\.org|python\.org|pypi\.org|pythonhosted\.org|golang\.org|ansible\.com|jenkins\.io|jenkins-ci\.org|hashicorp\.com|opentofu\.org|renovatebot\.com|pre-commit\.com|readthedocs\.io|openssh\.com)$''',
    # Schemas, licences and conventions referenced from metadata
    '''(?i)(^|\.)(json-schema\.org|schemastore\.org|semver\.org|opensource\.org|apache\.org|keepachangelog\.com|conventionalcommits\.org)$''',
    # Maintainer URL in Chart.yaml metadata
    '''(?i)(^|\.)skengineer\.be$''',
  ]
