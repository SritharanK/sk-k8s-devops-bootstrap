---
# Identity of the Jenkins controller in this namespace. The Kubernetes cloud
# of the controller authenticates with the token below (credential
# k8s-agent-token) to create, watch and delete agent pods and to run
# commands in their containers. No pod runs as this account.
apiVersion: v1
kind: ServiceAccount
metadata:
  name: jenkins-agent-launcher
  namespace: jenkins-agents
automountServiceAccountToken: false
---
# Long-lived token for jenkins-agent-launcher, filled in by the token
# controller. Read it with:
#   kubectl -n jenkins-agents get secret jenkins-agent-launcher-token \
#     -o jsonpath='{.data.token}' | base64 -d
# and store it as the role secret install_jenkins_k8s_agent_token. The token does
# not expire. Rotation: re-create this secret (the token controller issues a
# new token), update install_jenkins_k8s_agent_token and re-run the role. A
# time-bound alternative is "kubectl create token jenkins-agent-launcher
# --duration=...", at the cost of renewing the credential before it expires.
apiVersion: v1
kind: Secret
metadata:
  name: jenkins-agent-launcher-token
  namespace: jenkins-agents
  annotations:
    kubernetes.io/service-account.name: jenkins-agent-launcher
type: kubernetes.io/service-account-token
---
# Identity of the agent pods. It has no role binding and its token is never
# mounted: build steps cannot call the Kubernetes API.
apiVersion: v1
kind: ServiceAccount
metadata:
  name: jenkins-agent
  namespace: jenkins-agents
automountServiceAccountToken: false
