name: Feature request
description: Propose a new capability or a change to an existing one.
title: "feat: "
labels:
  - enhancement
body:
  - type: markdown
    attributes:
      value: |
        Describe the problem first; the proposal can change during review.
        Do not include hostnames, IP addresses, domains or other environment data.

  - type: dropdown
    id: component
    attributes:
      label: Component
      options:
        - provisioning (Ansible, RKE2)
        - gitops (Argo CD, bootstrap, ApplicationSets)
        - platform components (system charts)
        - policy (Kyverno)
        - workloads (app charts, sample services)
        - ci (workflows, make targets)
        - docs
    validations:
      required: true

  - type: dropdown
    id: profile
    attributes:
      label: Profile
      description: Which profile the change applies to.
      options:
        - lab
        - reference
        - both
    validations:
      required: true

  - type: textarea
    id: problem
    attributes:
      label: Problem
      description: What you are trying to do and what stops you today.
    validations:
      required: true

  - type: textarea
    id: proposal
    attributes:
      label: Proposed change
      description: What should change, and how it affects existing clusters, upgrades and the documented contracts.
    validations:
      required: true

  - type: textarea
    id: alternatives
    attributes:
      label: Alternatives considered
    validations:
      required: false

  - type: textarea
    id: context
    attributes:
      label: Additional context
      description: Links to upstream documentation, issues or related decisions (ADRs).
    validations:
      required: false
