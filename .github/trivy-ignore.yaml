      Warehouses, Freight, Promotions) in the shared and system namespaces and
      in Project namespaces; no wildcard on resources or API groups.
    expired_at: 2027-02-13
  - id: KSV-0050
    paths:
      - '*/apps/kargo.yaml'
      - '*/charts/helmcharts__system-charts__kargo.yaml'
    statement: >-
