# Accepted Trivy findings (make trivy-config, build-image.yml).
#
# Every entry needs an ID, the narrowest paths or packages it applies to, a
# statement with the reason, and an expiry date no more than 90 days out.
# An expired entry stops matching, so the finding fails CI again and is
# reviewed instead of being accepted forever. Format:
# https://trivy.dev/latest/docs/configuration/filtering/#trivyignoreyaml
#
# Example:
#   misconfigurations:
#     - id: KSV-0014
#       paths:
#         - "lab/apps/example.yaml"
#       statement: Upstream chart cannot run with a read-only root file system yet.
#       expired_at: 2027-02-01
# Paths are relative to the render output (make render): <profile>/apps/<application>.yaml
# and <profile>/charts/helmcharts__system-charts__<chart>.yaml.
