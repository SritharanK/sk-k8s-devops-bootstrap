  - id: KSV-0041
    paths:
      - '*/apps/kargo.yaml'
      - '*/charts/helmcharts__system-charts__kargo.yaml'
    statement: >-
      Kargo manages repository credentials as Secrets in Project namespaces and
      the shared namespace: the controller reads them for Git and registry
      access, the API and the project-admin role create them from the UI, and
      the management controller and webhooks set up per-Project RBAC over them.
    expired_at: 2027-02-13
  - id: KSV-0045
    paths:
      - '*/apps/kargo.yaml'
      - '*/charts/helmcharts__system-charts__kargo.yaml'
    statement: >-
