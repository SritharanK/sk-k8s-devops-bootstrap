# Docs: build the documentation site and publish it to GitHub Pages.
#
#   - Pull requests: strict MkDocs build (make docs-build). A broken link,
#     a page missing from the nav or an invalid anchor fails the job.
#   - main: the same build, then deployment of _out/site to GitHub Pages.
#
# Publishing needs GitHub Pages enabled with "GitHub Actions" as the source
# (repository Settings, Pages). That is a one-time owner action; until then
# the deploy job fails and the build job still reports.
#
# Supply chain: every action is pinned by full commit SHA with its version in
# a comment. MkDocs and its plugins come from requirements-docs.txt, pinned
# with hashes. No caches are used, because this workflow publishes. Only the
# deploy job can write to Pages, and only from main.

name: Docs

on:
  pull_request:
    paths:
      - docs/**
      - mkdocs.yml
      - requirements-docs.txt
      - hack/mkdocs_hooks.py
      - .github/workflows/docs.yml
  push:
    branches: [main]
    paths:
      - docs/**
      - mkdocs.yml
      - requirements-docs.txt
      - hack/mkdocs_hooks.py
      - .github/workflows/docs.yml
  workflow_dispatch:

permissions: {}

concurrency:
  group: docs-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

defaults:
  run:
    shell: bash

jobs:
  build:
    name: build
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    permissions:
      contents: read
    steps:
      - name: Check out
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - name: Set up tools
        uses: ./.github/actions/setup-tools
        with:
          tools: aqua:astral-sh/uv
          cache: "false"
      - name: Build the site (strict)
        env:
          NO_MKDOCS_2_WARNING: "1"
        run: make docs-build
      - name: Upload the Pages artifact
        if: github.event_name != 'pull_request' && github.ref == 'refs/heads/main'
        uses: actions/upload-pages-artifact@fc324d3547104276b827a68afc52ff2a11cc49c9 # v5.0.0
        with:
          path: _out/site

  deploy:
    name: deploy
    if: github.event_name != 'pull_request' && github.ref == 'refs/heads/main'
    needs: build
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    permissions:
      pages: write
      id-token: write
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    concurrency:
      group: pages
      cancel-in-progress: false
    steps:
      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@368f82528645a54fb793d4d04e342629a3f51346 # v5.0.1
