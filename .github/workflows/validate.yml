# Validation workflow — runs on every push and PR to main/master.
# Does not require a cluster, registry credentials, or secrets.
#
# Trivy scans here are ADVISORY (exit-code: 0, continue-on-error: true).
# ENFORCEMENT happens in Jenkins CI pipelines which block on CRITICAL/HIGH.

name: Validate

on:
  push:
    branches: [main, master]
  pull_request:
    branches: [main, master]
  # Allows manual runs from the GitHub Actions tab — useful for verifying the
  # pipeline passes on demand without a code change (e.g. after dependency bumps).
  workflow_dispatch:

jobs:
  helm-lint:
    name: Helm lint
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6

      - name: Install Helm
        uses: azure/setup-helm@v4
        with:
          version: "v3.13.0"

      - name: Build helm-common dependency for app charts
        run: |
          for chart in helmcharts/app-charts/*/; do
            helm dependency build "$chart" 2>/dev/null || true
          done

      - name: Lint all app Helm charts
        run: |
          for chart in helmcharts/app-charts/*/; do
            echo "── Linting $chart ──"
            helm lint "$chart" --strict
          done

      - name: Lint system Helm charts
        run: |
          for chart in helmcharts/system-charts/00_misc \
                       helmcharts/system-charts/network-policies \
                       helmcharts/system-charts/kyverno-policies \
                       helmcharts/system-charts/argocd-project; do
            if [ -f "$chart/Chart.yaml" ]; then
              echo "── Linting $chart ──"
              helm lint "$chart" --strict
            fi
          done

  helm-template:
    name: Helm template (argocd-bootstrap)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6

      - name: Install Helm
        uses: azure/setup-helm@v4
        with:
          version: "v3.13.0"

      - name: Template argocd-bootstrap
        run: |
          helm template argocd-bootstrap ./argocd-bootstrap \
            --set spec.source.repoURL=https://github.com/example/repo.git \
            --set spec.destination.server=https://kubernetes.default.svc \
            --set spec.destination.app_ns=prod \
            --set spec.destination.argo_ns=argocd \
            --set spec.source.targetRevision=main \
            > /dev/null
        working-directory: .

  yamllint:
    name: YAML lint
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6

      - name: Install yamllint
        run: pip install yamllint

      - name: Lint key YAML (relaxed)
        run: |
          yamllint -d relaxed config/defaults.yaml.example 2>/dev/null || true
          yamllint -d relaxed argocd-bootstrap/values.yaml 2>/dev/null || true
        continue-on-error: true

  # ── Trivy scans (advisory) ──────────────────────────────────────────────────
  # Scans are split by target so findings are clearly attributed.
  # Enforcement is in Jenkins CI (exit-code: 1, blocks merge).
  # To harden CI, set exit-code: '1' and remove continue-on-error on any job.

  trivy-dockerfiles:
    name: Trivy — Dockerfiles (sample-services)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6

      - name: Scan Dockerfiles for misconfigurations
        uses: aquasecurity/trivy-action@v0.36.0
        with:
          scan-type: config
          scan-ref: sample-services/
          exit-code: '0'
          severity: CRITICAL,HIGH
          format: table
        continue-on-error: true

  trivy-helmcharts:
    name: Trivy — Helm charts (helmcharts/)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6

      - name: Scan Helm charts for Kubernetes misconfigurations
        uses: aquasecurity/trivy-action@v0.36.0
        with:
          scan-type: config
          scan-ref: helmcharts/
          exit-code: '0'
          severity: CRITICAL,HIGH
          format: table
        continue-on-error: true

  trivy-kyverno-policies:
    name: Trivy — Kyverno policies (helmcharts/system-charts/kyverno-policies)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6

      - name: Scan Kyverno policy templates for misconfigurations
        uses: aquasecurity/trivy-action@v0.36.0
        with:
          scan-type: config
          scan-ref: helmcharts/system-charts/kyverno-policies/
          exit-code: '0'
          severity: CRITICAL,HIGH
          format: table
        continue-on-error: true

  trivy-iac-argocd:
    name: Trivy — IaC (argocd-bootstrap)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6

      - name: Scan ArgoCD bootstrap manifests for misconfigurations
        uses: aquasecurity/trivy-action@v0.36.0
        with:
          scan-type: config
          scan-ref: argocd-bootstrap/
          exit-code: '0'
          severity: CRITICAL,HIGH
          format: table
        continue-on-error: true

  gitleaks:
    name: Secrets scan (Gitleaks)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6
        with:
          fetch-depth: 0

      - name: Run Gitleaks
        uses: gitleaks/gitleaks-action@v2
        env:
          GITLEAKS_LICENSE: ${{ secrets.GITLEAKS_LICENSE }}
        continue-on-error: true
