# Repository credentials for a private fork. Not needed for a public repository.
#
# Never commit a filled-in copy. Either keep it outside the repository:
#   export REPO_SECRET_FILE=/path/outside/repo-secret.yaml
#   make bootstrap-gitops CLUSTER=<name>
# or encrypt it with SOPS and age (bootstrap secrets only, reference profile):
#   out=bootstrap/secrets/<name>/repo-secret.sops.yaml
#   sops --encrypt --age <recipient> repo-secret.yaml > "$out"
#   REPO_SECRET_FILE="$out" make bootstrap-gitops CLUSTER=<name>
#
# Use a dedicated read-only deploy key for this repository, never a personal
# key.
# The url must equal git.repoURL in clusters/<name>/cluster.yaml character for
# character. For SSH, the host key must be pinned in the Argo CD known hosts
# (configs.ssh.knownHosts in the argo-cd wrapper chart); never disable host
# key verification.
---
apiVersion: v1
kind: Secret
metadata:
  name: repo-sk-k8s-devops-bootstrap
  namespace: argocd
  labels:
    argocd.argoproj.io/secret-type: repository
type: Opaque
stringData:
  type: git
  url: git@github.com:YOUR_ORG/sk-k8s-devops-bootstrap.git
  sshPrivateKey: |
    CHANGE_ME
  # HTTPS alternative: the https form of the url with username and a
  # fine-grained read-only token in password, or a GitHub App
  # (githubAppID, githubAppInstallationID, githubAppPrivateKey).
